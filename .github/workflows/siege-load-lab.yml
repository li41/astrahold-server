name: Siege Load Lab

on:
  pull_request:
    paths:
      - 'cmd/loadbot/**'
      - 'cmd/loadserver/**'
      - 'internal/loadlab/**'
      - 'internal/spatial/**'
      - 'internal/simulation/**'
      - 'internal/worldruntime/**'
      - 'internal/netadapter/tcpudp/**'
      - '.github/workflows/siege-load-lab.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: Load scenario
        required: true
        default: gate-zerg
        type: choice
        options:
          - distributed
          - gate-zerg
          - vertical-siege
      clients:
        description: Headless clients
        required: true
        default: '500'
        type: string
      duration_seconds:
        description: Measurement duration in seconds
        required: true
        default: '60'
        type: string
      tick_rate:
        description: Server tick rate
        required: true
        default: '20'
        type: string
      snapshot_rate:
        description: Snapshot rate
        required: true
        default: '10'
        type: string

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build load tools
        run: |
          go build -o /tmp/astrahold-loadserver ./cmd/loadserver
          go build -o /tmp/astrahold-loadbot ./cmd/loadbot
      - name: Run 24-client vertical siege smoke
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          /tmp/astrahold-loadserver \
            -tcp 127.0.0.1:17777 \
            -udp 127.0.0.1:17778 \
            -clients 24 \
            -scenario vertical-siege \
            -duration 5s \
            -ready-timeout 20s \
            -report artifacts/server.json \
            > artifacts/server.log 2>&1 &
          SERVER_PID=$!
          sleep 1

          set +e
          /tmp/astrahold-loadbot \
            -tcp 127.0.0.1:17777 \
            -clients 24 \
            -scenario vertical-siege \
            -input-rate 20 \
            -ramp-up 1s \
            -duration 15s \
            -report artifacts/bots.json \
            > artifacts/bots.log 2>&1
          BOT_STATUS=$?
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e

          cat artifacts/server.json || true
          cat artifacts/bots.json || true
          test "$BOT_STATUS" -eq 0
          test "$SERVER_STATUS" -eq 0
          jq -e '.ready_clients == .requested_clients' artifacts/bots.json >/dev/null
          jq -e '.ticks > 0' artifacts/server.json >/dev/null
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-load-smoke
          path: artifacts/

  gate-zerg-100:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build load tools
        run: |
          go build -o /tmp/astrahold-loadserver ./cmd/loadserver
          go build -o /tmp/astrahold-loadbot ./cmd/loadbot
      - name: Run 100-client Gate Zerg baseline
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          /tmp/astrahold-loadserver \
            -tcp 127.0.0.1:17777 \
            -udp 127.0.0.1:17778 \
            -clients 100 \
            -scenario gate-zerg \
            -duration 8s \
            -ready-timeout 30s \
            -report artifacts/server.json \
            > artifacts/server.log 2>&1 &
          SERVER_PID=$!
          sleep 1

          set +e
          /tmp/astrahold-loadbot \
            -tcp 127.0.0.1:17777 \
            -clients 100 \
            -scenario gate-zerg \
            -input-rate 20 \
            -ramp-up 2s \
            -duration 20s \
            -report artifacts/bots.json \
            > artifacts/bots.log 2>&1
          BOT_STATUS=$?
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e

          cat artifacts/server.json || true
          cat artifacts/bots.json || true
          test "$BOT_STATUS" -eq 0
          test "$SERVER_STATUS" -eq 0
          jq -e '.ready_clients == .requested_clients' artifacts/bots.json >/dev/null
          jq -e '.ticks > 0' artifacts/server.json >/dev/null
      - name: Upload 100-client baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-load-gate-zerg-100
          path: artifacts/

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build load tools
        run: |
          go build -o /tmp/astrahold-loadserver ./cmd/loadserver
          go build -o /tmp/astrahold-loadbot ./cmd/loadbot
      - name: Run Siege Load Lab
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario }}
          CLIENTS: ${{ inputs.clients }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          TICK_RATE: ${{ inputs.tick_rate }}
          SNAPSHOT_RATE: ${{ inputs.snapshot_rate }}
        run: |
          set -u
          mkdir -p artifacts
          BOT_TIMEOUT=$((DURATION_SECONDS + 90))
          /tmp/astrahold-loadserver \
            -tcp 127.0.0.1:17777 \
            -udp 127.0.0.1:17778 \
            -clients "$CLIENTS" \
            -scenario "$SCENARIO" \
            -tick-rate "$TICK_RATE" \
            -snapshot-rate "$SNAPSHOT_RATE" \
            -duration "${DURATION_SECONDS}s" \
            -ready-timeout 60s \
            -report artifacts/server.json \
            > artifacts/server.log 2>&1 &
          SERVER_PID=$!
          sleep 1

          set +e
          /tmp/astrahold-loadbot \
            -tcp 127.0.0.1:17777 \
            -clients "$CLIENTS" \
            -scenario "$SCENARIO" \
            -input-rate "$TICK_RATE" \
            -ramp-up 10s \
            -duration "${BOT_TIMEOUT}s" \
            -report artifacts/bots.json \
            > artifacts/bots.log 2>&1
          BOT_STATUS=$?
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e

          cat artifacts/server.json || true
          cat artifacts/bots.json || true
          test "$BOT_STATUS" -eq 0
          test "$SERVER_STATUS" -eq 0
      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-load-${{ inputs.scenario }}-${{ inputs.clients }}
          path: artifacts/
