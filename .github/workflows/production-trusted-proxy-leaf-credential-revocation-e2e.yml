name: Production Trusted Proxy Leaf Credential Revocation E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  trusted-proxy-leaf-credential-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl

      - name: Run leaf credential revocation acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f24-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          edge_policy="$data_root/edge-policy.json"
          revocations="$data_root/leaf-revocations.json"
          server_log="$RUNNER_TEMP/s4f24-worldd.log"
          holder_log="$RUNNER_TEMP/s4f24-holder.log"
          holder_script="$RUNNER_TEMP/s4f24-holder.py"
          phase_revoke="$RUNNER_TEMP/s4f24-revoke"
          phase_revoke_done="$RUNNER_TEMP/s4f24-revoke.done"
          wrong_password="F24-Wrong-Password-Should-Not-Log!"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          rm -f "$phase_revoke" "$phase_revoke_done"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' 'F24-Correct-Horse-Battery-Staple!' | "$ACCOUNTCTL" create \
            -path "$accounts_file" -login holder -character f24-character -password-stdin

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-ca.key" -out "$tls_dir/server-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.24 Server CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -in "$tls_dir/server.csr" -CA "$tls_dir/server-ca.crt" -CAkey "$tls_dir/server-ca.key" -CAcreateserial -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/edge-ca.key" -out "$tls_dir/edge-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.24 Edge CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1

          make_leaf() {
            label="$1"
            openssl req -newkey rsa:2048 -nodes -keyout "$tls_dir/edge-$label.key" -out "$tls_dir/edge-$label.csr" -subj "/CN=edge-a.astrahold.test" >/dev/null 2>&1
            cat >"$tls_dir/edge-$label.ext" <<'EOF'
          subjectAltName=DNS:edge-a.astrahold.test
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          EOF
            openssl x509 -req -in "$tls_dir/edge-$label.csr" -CA "$tls_dir/edge-ca.crt" -CAkey "$tls_dir/edge-ca.key" -CAcreateserial -out "$tls_dir/edge-$label.crt" -days 1 -sha256 -extfile "$tls_dir/edge-$label.ext" >/dev/null 2>&1
          }
          make_leaf a
          make_leaf b

          leaf_a_spki="$(openssl x509 -in "$tls_dir/edge-a.crt" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          leaf_b_spki="$(openssl x509 -in "$tls_dir/edge-b.crt" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$leaf_a_spki" != "$leaf_b_spki"

          cat >"$edge_policy" <<EOF
          {
            "schema_version": 1,
            "revision": "edge-001",
            "forwarded_header": "x-forwarded-for",
            "client_ca_file": "tls/edge-ca.crt",
            "bindings": [{"prefixes":["127.0.0.2/32"],"dns_names":["edge-a.astrahold.test"]}]
          }
          EOF
          cat >"$revocations" <<'EOF'
          {"schema_version":1,"revision":"leaf-001","revoked_spki_sha256":[]}
          EOF
          chmod 600 "$accounts_file" "$edge_policy" "$revocations" "$tls_dir"/*.key

          cat >"$holder_script" <<'PY'
          import http.client, os, select, ssl, sys, time
          server_ca, cert_a, key_a, cert_b, key_b, go, done = sys.argv[1:]
          def conn(cert, key, source="127.0.0.2"):
              ctx = ssl.create_default_context(cafile=server_ca)
              ctx.minimum_version = ssl.TLSVersion.TLSv1_3
              ctx.load_cert_chain(certfile=cert, keyfile=key)
              return http.client.HTTPSConnection("127.0.0.1", 39644, context=ctx, source_address=(source, 0), timeout=5)
          def request(c, source):
              body = b'{"login_id":"holder","login_secret":"F24-Wrong-Password-Should-Not-Log!"}'
              c.request("POST", "/v1/session/login", body=body, headers={"Content-Type":"application/json","X-Forwarded-For":source})
              r = c.getresponse(); r.read(); return r.status
          def port(c): return c.sock.getsockname()[1]
          def wait_closed(c, label):
              s = c.sock
              deadline = time.time() + 5
              while time.time() < deadline:
                  rd, _, _ = select.select([s], [], [], 0.1)
                  if not rd: continue
                  try: data = s.recv(1)
                  except Exception: return
                  if data == b'': return
                  raise RuntimeError(label + " unexpected data")
              raise RuntimeError(label + " was not retired")
          def assert_open(c, label):
              s = c.sock
              rd, _, _ = select.select([s], [], [], 0.4)
              if rd:
                  try: data = s.recv(1)
                  except Exception as exc: raise RuntimeError(label + " retired") from exc
                  if data == b'': raise RuntimeError(label + " retired")
                  raise RuntimeError(label + " pending data")
          a = conn(cert_a, key_a); b = conn(cert_b, key_b)
          assert request(a, "198.51.100.240") == 401
          assert request(b, "198.51.100.241") == 401
          a_port, b_port = port(a), port(b)
          for _ in range(300):
              if os.path.exists(go): break
              time.sleep(0.1)
          else: raise RuntimeError("revoke phase timeout")
          wait_closed(a, "Leaf A")
          assert_open(b, "Leaf B")
          assert request(b, "198.51.100.242") == 401
          if port(b) != b_port: raise RuntimeError("Leaf B silently reconnected")
          if a_port == b_port: raise RuntimeError("unexpected identical local ports")
          with open(done, "w") as f: f.write("done\n")
          b.close(); a.close()
          PY

          cleanup() {
            set +e
            for pid in "${holder_pid:-}" "${server_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"; marker="$2"; pid="$3"
            for _ in $(seq 1 300); do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$file" || true; cat "$server_log" || true; return 1; fi
              sleep 0.1
            done
            echo "timed out waiting for: $marker"; cat "$file" || true; cat "$server_log" || true; return 1
          }
          wait_for_file() {
            file="$1"; pid="$2"; log="$3"
            for _ in $(seq 1 300); do
              if [ -f "$file" ]; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log" || true; return 1; fi
              sleep 0.1
            done
            cat "$log" || true; return 1
          }

          "$GITHUB_WORKSPACE/.tools/worldd" \
            -tcp 127.0.0.1:39977 -udp 127.0.0.1:39978 \
            -session-login-account-file "$accounts_file" \
            -session-login-tls-listen 127.0.0.1:39644 \
            -session-login-tls-cert "$tls_dir/server.crt" \
            -session-login-tls-key "$tls_dir/server.key" \
            -session-login-trusted-proxy-edge-policy-file "$edge_policy" \
            -session-login-trusted-proxy-leaf-revocation-file "$revocations" \
            -session-login-trusted-proxy-edge-retire-old-connections \
            -session-login-ip-max-attempts 100 -session-login-ip-attempt-window 1m \
            -character-state-dir "$data_root/character-state" \
            -character-state-save-journal "$data_root/character-state-saves.journal" \
            -character-state-save-checkpoint "$data_root/character-state-saves.checkpoint.json" \
            -death-outcome-journal "$data_root/death-outcomes.journal" \
            -death-outcome-checkpoint "$data_root/death-outcomes.checkpoint.json" \
            -siege-ownership-dir "$data_root/siege-ownership" >"$server_log" 2>&1 &
          server_pid=$!

          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=9" "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy leaf revocation: enabled=true generation=1 revision=leaf-001 revoked_credentials=0 identifier=spki-sha256" "$server_pid"

          python3 "$holder_script" "$tls_dir/server-ca.crt" "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" "$tls_dir/edge-b.crt" "$tls_dir/edge-b.key" "$phase_revoke" "$phase_revoke_done" >"$holder_log" 2>&1 &
          holder_pid=$!
          sleep 1

          python3 - "$revocations" "$leaf_a_spki" <<'PY'
          import json, os, sys
          path, value = sys.argv[1:]
          tmp = path + ".tmp"
          with open(tmp, "w") as f:
              json.dump({"schema_version":1,"revision":"leaf-002","revoked_spki_sha256":[value]}, f)
              f.write("\n"); f.flush(); os.fsync(f.fileno())
          os.replace(tmp, path); os.chmod(path, 0o600)
          PY
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy leaf revocation reload applied: previous_generation=1 generation=2 previous_revision=leaf-001 revision=leaf-002 revoked_credentials=1 connection_cutover=retire-old retired_connections=1" "$server_pid"
          touch "$phase_revoke"
          wait_for_file "$phase_revoke_done" "$holder_pid" "$holder_log"
          wait "$holder_pid"
          unset holder_pid

          # Fresh A must fail during TLS; fresh B remains accepted.
          python3 - "$tls_dir/server-ca.crt" "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" "$tls_dir/edge-b.crt" "$tls_dir/edge-b.key" <<'PY'
          import http.client, ssl, sys
          ca, ca_cert, ca_key, cb_cert, cb_key = sys.argv[1:]
          def attempt(cert, key):
              ctx = ssl.create_default_context(cafile=ca); ctx.minimum_version = ssl.TLSVersion.TLSv1_3; ctx.load_cert_chain(cert, key)
              c = http.client.HTTPSConnection("127.0.0.1", 39644, context=ctx, source_address=("127.0.0.2",0), timeout=5)
              try:
                  c.request("POST","/v1/session/login",body=b'{"login_id":"holder","login_secret":"bad"}',headers={"Content-Type":"application/json","X-Forwarded-For":"198.51.100.243"})
                  r=c.getresponse(); r.read(); return r.status
              finally: c.close()
          try:
              attempt(ca_cert, ca_key)
          except Exception:
              pass
          else:
              raise SystemExit("revoked Leaf A fresh handshake unexpectedly succeeded")
          if attempt(cb_cert, cb_key) != 401:
              raise SystemExit("healthy Leaf B fresh handshake failed")
          PY

          # Invalid replacement retains generation 2 and retires nobody.
          printf '%s\n' '{"schema_version":1,"revision":"bad","revoked_spki_sha256":[],"unknown":true}' >"$revocations"
          chmod 600 "$revocations"
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy leaf revocation reload rejected; last-known-good retained: generation=2 revision=leaf-002 revoked_credentials=1" "$server_pid"

          # Representation-only duplicate/revision change is a semantic no-op.
          python3 - "$revocations" "$leaf_a_spki" <<'PY'
          import json, os, sys
          path, value = sys.argv[1:]
          with open(path, "w") as f:
              json.dump({"schema_version":1,"revision":"leaf-representation-only","revoked_spki_sha256":[value,value]}, f)
              f.write("\n"); f.flush(); os.fsync(f.fileno())
          os.chmod(path, 0o600)
          PY
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy leaf revocation reload no-op: previous_generation=2 generation=2 previous_revision=leaf-002 revision=leaf-002 revoked_credentials=1 connection_cutover=retire-old retired_connections=0" "$server_pid"

          # Direct Client remains TLS server-auth-only with no proxy certificate.
          direct_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --cacert "$tls_dir/server-ca.crt" --resolve localhost:39644:127.0.0.1 -H 'Content-Type: application/json' --data '{"login_id":"holder","login_secret":"bad"}' https://localhost:39644/v1/session/login)"
          test "$direct_status" = "401"

          if grep -Fq "$leaf_a_spki" "$server_log" || grep -Fq "$leaf_b_spki" "$server_log"; then
            echo "credential hash leaked to server log"; cat "$server_log"; exit 1
          fi
          if grep -Fq "$wrong_password" "$server_log" || grep -Fq "198.51.100.24" "$server_log"; then
            echo "secret/source data leaked to server log"; cat "$server_log"; exit 1
          fi

          echo "ASTRAHOLD_F24_LEAF_REVOCATION_OK leaf_revocation=true same_identity_healthy_leaf_survives=true revoked_leaf_retired=true fresh_revoked_leaf_rejected=true invalid_lkg=true noop=true direct_client_unchanged=true protocol=9 tls=1.3"
