name: Production Recovery Delivery Provider E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  https-relay-recovery-product-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - name: Checkout S4-F.11 client fence
        uses: actions/checkout@v4
        with:
          repository: li41/astrahold-client
          ref: 4f4dd15865ebf8ac65495e598f93f3895296031d
          path: .e2e-client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools and client
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .e2e-client rev-parse HEAD)" = "4f4dd15865ebf8ac65495e598f93f3895296031d"
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl
          dotnet restore .e2e-client/Astrahold.Client.csproj
          dotnet build .e2e-client/Astrahold.Client.csproj --configuration Debug --no-restore

      - name: Download official Godot 4.7.1 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/godot
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d .tools/godot
          GODOT="$(find .tools/godot -type f -name 'Godot_v4.7.1-stable_mono_linux*' ! -path '*/GodotSharp/*' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Run HTTPS relay operational hardening and product recovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f13-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          provider_file="$data_root/recovery-provider.json"
          relay_credential_file="$data_root/recovery-relay.token"
          relay_script="$data_root/fake-recovery-relay.py"
          relay_state="$data_root/relay-state.json"
          relay_proof_file="$data_root/relay-proof.txt"
          relay_log="$RUNNER_TEMP/s4f13-relay.log"
          server_log="$RUNNER_TEMP/s4f13-worldd.log"
          client_log="$RUNNER_TEMP/s4f13-product-main.log"
          unknown_body="$RUNNER_TEMP/s4f13-unknown-request.json"
          blocked_body="$RUNNER_TEMP/s4f13-blocked-request.json"
          holder_body="$RUNNER_TEMP/s4f13-holder-request.json"
          blocked_reset_body="$RUNNER_TEMP/s4f13-blocked-reset.json"
          old_login_body="$RUNNER_TEMP/s4f13-old-login.json"
          old_password="F13-Old-Correct-Horse-Battery-Staple!"
          blocked_password="F13-Blocked-Correct-Horse-Battery-Staple!"
          new_password="F13-New-Correct-Horse-Battery-Staple!"
          throwaway_password="F13-Throwaway-New-Password-Only!"
          relay_credential="F13-Relay-Bearer-Credential-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          holder_destination="holder@example.invalid"
          blocked_destination="blocked@example.invalid"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' "$old_password" | "$ACCOUNTCTL" create \
            -path "$accounts_file" -login holder -character f13-holder-character -password-stdin
          printf '%s\n' "$blocked_password" | "$ACCOUNTCTL" create \
            -path "$accounts_file" -login blocked -character f13-blocked-character -password-stdin

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.13 CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF_EXT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF_EXT
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial \
            -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1

          printf '%s\n' "$relay_credential" > "$relay_credential_file"
          chmod 600 "$relay_credential_file"

          python3 - "$provider_file" "$accounts_file" "$relay_credential_file" "$tls_dir/ca.crt" <<'PY'
          import base64, hashlib, json, os, sys
          provider_path, accounts_path, credential_path, ca_path = sys.argv[1:]
          with open(accounts_path, encoding="utf-8") as f:
              store = json.load(f)
          assert store["schema_version"] == 4
          accounts = {item["login_id"]: item for item in store["accounts"]}
          assert accounts["holder"]["credential_version"] == 1
          assert accounts["blocked"]["credential_version"] == 1
          key = hashlib.sha256(b"Astrahold S4-F.13 CI delivery proof key").digest()
          definition = {
              "schema_version": 2,
              "revision": "s4f13-provider-001",
              "proof_key_base64url": base64.urlsafe_b64encode(key).rstrip(b"=").decode("ascii"),
              "delivery": {
                  "adapter": "https-json-v1",
                  "revision": "s4f13-relay-001",
                  "endpoint": "https://localhost:41445/deliver",
                  "credential_file": credential_path,
                  "ca_file": ca_path,
                  "request_timeout": "1s",
                  "max_attempts": 3,
                  "retry_backoff": "50ms",
              },
              "subjects": [
                  {"login_id": "holder", "destination": "holder@example.invalid"},
                  {"login_id": "blocked", "destination": "blocked@example.invalid"},
              ],
          }
          fd = os.open(provider_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as f:
              json.dump(definition, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          assert "F13-Relay-Bearer-Credential" not in open(provider_path, encoding="utf-8").read()
          PY

          blocked_expected_proof="$(python3 - "$accounts_file" <<'PY'
          import base64, hashlib, hmac, json, struct, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              store = json.load(f)
          account = next(item for item in store["accounts"] if item["login_id"] == "blocked")
          key = hashlib.sha256(b"Astrahold S4-F.13 CI delivery proof key").digest()
          login_id = account["login_id"].encode()
          account_id = account["account_id"].encode()
          mac = hmac.new(key, digestmod=hashlib.sha256)
          mac.update(b"astrahold-recovery-delivery-v1")
          mac.update(struct.pack(">I", len(login_id)))
          mac.update(login_id)
          mac.update(struct.pack(">I", len(account_id)))
          mac.update(account_id)
          mac.update(struct.pack(">Q", account["credential_version"]))
          print(base64.urlsafe_b64encode(mac.digest()).rstrip(b"=").decode())
          PY
          )"
          test -n "$blocked_expected_proof"

          cat > "$relay_script" <<'PY'
          import http.server
          import json
          import os
          import ssl
          import sys

          host, port, cert, key, credential_file, proof_file, state_file = sys.argv[1:]
          port = int(port)
          with open(credential_file, encoding="utf-8") as f:
              credential = f.read().strip()
          attempts = {}
          counts = {}
          state = {"holder_attempts": 0, "blocked_attempts": 0, "accepted": 0}

          def save_state():
              tmp = state_file + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(state, f, sort_keys=True)
                  f.write("\n")
                  f.flush()
                  os.fsync(f.fileno())
              os.replace(tmp, state_file)

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def log_message(self, fmt, *args):
                  return
              def respond(self, status):
                  self.send_response(status)
                  self.send_header("Content-Length", "0")
                  self.end_headers()
              def do_POST(self):
                  if self.path != "/deliver":
                      self.respond(404)
                      return
                  if self.headers.get("Authorization") != "Bearer " + credential:
                      print("F13_RELAY_AUTH_REJECTED", flush=True)
                      self.respond(401)
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length <= 0 or length > 4096:
                      self.respond(400)
                      return
                  raw = self.rfile.read(length)
                  try:
                      body = json.loads(raw)
                  except Exception:
                      self.respond(400)
                      return
                  if set(body) != {"schema_version", "delivery_id", "destination", "proof", "expires_at"}:
                      self.respond(400)
                      return
                  delivery_id = body.get("delivery_id")
                  if body.get("schema_version") != 1 or not isinstance(delivery_id, str) or not delivery_id:
                      self.respond(400)
                      return
                  if self.headers.get("Idempotency-Key") != delivery_id or self.headers.get("X-Astrahold-Delivery-ID") != delivery_id:
                      self.respond(400)
                      return
                  if b"request_id" in raw or credential.encode() in raw:
                      self.respond(400)
                      return
                  previous = attempts.get(delivery_id)
                  if previous is None:
                      attempts[delivery_id] = raw
                  elif previous != raw:
                      print("F13_RELAY_IDEMPOTENCY_MISMATCH", flush=True)
                      self.respond(409)
                      return
                  counts[delivery_id] = counts.get(delivery_id, 0) + 1
                  destination = body.get("destination")
                  if destination == "blocked@example.invalid":
                      state["blocked_attempts"] += 1
                      save_state()
                      print("F13_RELAY_PERMANENT attempts=1", flush=True)
                      self.respond(400)
                      return
                  if destination != "holder@example.invalid":
                      self.respond(400)
                      return
                  state["holder_attempts"] += 1
                  if counts[delivery_id] == 1:
                      save_state()
                      print("F13_RELAY_TRANSIENT status_class=5xx", flush=True)
                      self.respond(503)
                      return
                  proof = body.get("proof")
                  if not isinstance(proof, str) or not proof:
                      self.respond(400)
                      return
                  fd = os.open(proof_file, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(proof + "\n")
                      f.flush()
                      os.fsync(f.fileno())
                  state["accepted"] += 1
                  save_state()
                  print("F13_RELAY_ACCEPTED attempts=2 tls=1.3 idempotent=true", flush=True)
                  self.respond(202)

          server = http.server.ThreadingHTTPServer((host, port), Handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.minimum_version = ssl.TLSVersion.TLSv1_3
          context.load_cert_chain(cert, key)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          print("F13_RELAY_READY tls=1.3", flush=True)
          server.serve_forever()
          PY

          chmod 600 "$tls_dir/ca.key" "$tls_dir/server.key" "$accounts_file" "$provider_file" "$relay_credential_file"

          cleanup() {
            set +e
            for pid in "${client_pid:-}" "${server_pid:-}" "${relay_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"
            marker="$2"
            pid="$3"
            attempts="$4"
            i=0
            while [ "$i" -lt "$attempts" ]; do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process exited before marker: $marker"
                cat "$file" || true
                cat "$server_log" || true
                cat "$relay_log" || true
                return 1
              fi
              sleep 0.1
              i=$((i + 1))
            done
            echo "timed out waiting for marker: $marker"
            cat "$file" || true
            cat "$server_log" || true
            cat "$relay_log" || true
            return 1
          }

          wait_success() {
            pid="$1"
            label="$2"
            log_file="$3"
            set +e
            wait "$pid"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "$label failed with status $status"
              cat "$log_file" || true
              cat "$server_log" || true
              cat "$relay_log" || true
              exit 1
            fi
          }

          python3 "$relay_script" 127.0.0.1 41445 "$tls_dir/server.crt" "$tls_dir/server.key" \
            "$relay_credential_file" "$relay_proof_file" "$relay_state" >"$relay_log" 2>&1 &
          relay_pid=$!
          wait_for_marker "$relay_log" "F13_RELAY_READY tls=1.3" "$relay_pid" 200

          "$GITHUB_WORKSPACE/.tools/worldd" \
            -tcp 127.0.0.1:39777 \
            -udp 127.0.0.1:39778 \
            -session-login-account-file "$accounts_file" \
            -session-login-tls-listen 127.0.0.1:39444 \
            -session-login-tls-cert "$tls_dir/server.crt" \
            -session-login-tls-key "$tls_dir/server.key" \
            -session-login-ip-max-attempts 50 \
            -session-login-ip-attempt-window 1m \
            -session-credential-ttl 5m \
            -session-recovery-provider-file "$provider_file" \
            -session-recovery-challenge-ttl 5m \
            -session-recovery-challenge-max-attempts 5 \
            -session-recovery-ip-max-attempts 50 \
            -session-recovery-ip-attempt-window 1m \
            -trusted-tls-listen 127.0.0.1:39443 \
            -trusted-tls-cert "$tls_dir/server.crt" \
            -trusted-tls-key "$tls_dir/server.key" \
            -character-state-dir "$data_root/character-state" \
            -character-state-save-journal "$data_root/character-state-saves.journal" \
            -character-state-save-checkpoint "$data_root/character-state-saves.checkpoint.json" \
            -death-outcome-journal "$data_root/death-outcomes.journal" \
            -death-outcome-checkpoint "$data_root/death-outcomes.checkpoint.json" \
            -siege-ownership-dir "$data_root/siege-ownership" >"$server_log" 2>&1 &
          server_pid=$!

          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=9" "$server_pid" 300
          wait_for_marker "$server_log" "session login issuance: enabled=true revision=durable-3" "$server_pid" 300
          wait_for_marker "$server_log" "session recovery: enabled=true provider=hmac-sha256-generation-delivery revision=s4f13-provider-001" "$server_pid" 300

          unknown_status="$(printf '{"login_id":"missing-holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$unknown_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          test "$unknown_status" = "202"
          test ! -e "$relay_state"

          blocked_status="$(printf '{"login_id":"blocked"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$blocked_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          test "$blocked_status" = "202"
          python3 - "$relay_state" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              state = json.load(f)
          assert state == {"accepted": 0, "blocked_attempts": 1, "holder_attempts": 0}, state
          PY

          holder_status="$(printf '{"login_id":"holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$holder_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          test "$holder_status" = "202"
          test -f "$relay_proof_file"
          test "$(stat -c '%a' "$relay_proof_file")" = "600"
          delivered_proof="$(tr -d '\n' < "$relay_proof_file")"
          test -n "$delivered_proof"
          python3 - "$relay_state" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              state = json.load(f)
          assert state == {"accepted": 1, "blocked_attempts": 1, "holder_attempts": 2}, state
          PY

          read -r unknown_request_id blocked_request_id holder_request_id < <(python3 - "$unknown_body" "$blocked_body" "$holder_body" <<'PY'
          import datetime, json, sys
          bodies = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as f:
                  body = json.load(f)
              assert set(body) == {"request_id", "expires_at"}
              assert isinstance(body["request_id"], str) and body["request_id"]
              datetime.datetime.fromisoformat(body["expires_at"].replace("Z", "+00:00"))
              bodies.append(body)
          assert len({body["request_id"] for body in bodies}) == 3
          print(*(body["request_id"] for body in bodies))
          PY
          )
          test -n "$unknown_request_id"
          test -n "$blocked_request_id"
          test -n "$holder_request_id"

          blocked_reset_status="$(printf '{"request_id":"%s","recovery_proof":"%s","new_password":"%s"}' \
            "$blocked_request_id" "$blocked_expected_proof" "$throwaway_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$blocked_reset_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/reset)"
          test "$blocked_reset_status" = "401"
          grep -F '"error":"invalid_recovery"' "$blocked_reset_body"

          grep -F "recovery delivery: adapter=https-json-v1 revision=s4f13-relay-001 outcome=permanent attempts=1 status_class=4xx" "$server_log"
          grep -F "recovery delivery: adapter=https-json-v1 revision=s4f13-relay-001 outcome=success attempts=2 status_class=2xx" "$server_log"
          grep -F "F13_RELAY_PERMANENT attempts=1" "$relay_log"
          grep -F "F13_RELAY_ACCEPTED attempts=2 tls=1.3 idempotent=true" "$relay_log"

          ASTRAHOLD_SESSION_LOGIN_URL="https://localhost:39444" \
          ASTRAHOLD_SESSION_LOGIN_ID=holder \
          ASTRAHOLD_SERVER_HOST=127.0.0.1 \
          ASTRAHOLD_SERVER_PORT=39443 \
          ASTRAHOLD_TLS_SERVER_NAME=localhost \
          ASTRAHOLD_TLS_CA="$tls_dir/ca.crt" \
          ASTRAHOLD_F11_AUTOMATION_MODE=recovery \
          ASTRAHOLD_F11_AUTOMATION_RECOVERY_PROOF="$delivered_proof" \
          ASTRAHOLD_F11_AUTOMATION_NEW_SECRET="$new_password" \
          ASTRAHOLD_F11_AUTOMATION_LOGIN_SECRET="$new_password" \
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/.e2e-client" res://scenes/Main.tscn >"$client_log" 2>&1 &
          client_pid=$!

          wait_for_marker "$client_log" "ASTRAHOLD_F11_UNKNOWN_REQUEST_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_INVALID_RECOVERY_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_RESET_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_RECOVERY_LOGIN_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_CLIENT_RECOVERY_UX_OK" "$client_pid" 600
          wait_success "$client_pid" "F.13 HTTPS relay proof through F.11 product recovery UX" "$client_log"
          client_pid=""

          old_status="$(printf '{"login_id":"holder","login_secret":"%s"}' "$old_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$old_login_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/session/login)"
          test "$old_status" = "401"
          grep -F '"error":"invalid_credentials"' "$old_login_body"

          python3 - "$accounts_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              store = json.load(f)
          accounts = {item["login_id"]: item for item in store["accounts"]}
          assert store["schema_version"] == 4
          assert accounts["holder"]["credential_version"] == 2
          assert accounts["blocked"]["credential_version"] == 1
          assert not store.get("recovery_grants")
          print("ASTRAHOLD_F13_STORE_OK schema=4 holder_credential_version=2 blocked_credential_version=1")
          PY

          for secret in "$old_password" "$blocked_password" "$new_password" "$throwaway_password" \
                        "$blocked_expected_proof" "$delivered_proof" "$relay_credential" \
                        "F11-Wrong-Recovery-Proof!" "F11-Throwaway-New-Password-Only!" \
                        "$holder_destination" "$blocked_destination"; do
            for log_file in "$client_log" "$server_log" "$relay_log"; do
              if grep -Fq "$secret" "$log_file"; then
                echo "F.13 captured log leaked secret/provider material: $log_file"
                exit 1
              fi
            done
          done
          for opaque_id in "$unknown_request_id" "$blocked_request_id" "$holder_request_id"; do
            for log_file in "$client_log" "$server_log" "$relay_log"; do
              if grep -Fq "$opaque_id" "$log_file"; then
                echo "F.13 captured log leaked opaque recovery request metadata: $log_file"
                exit 1
              fi
            done
          done
          if grep -Fq "request_id" "$client_log" || grep -Fq "request_id" "$relay_log"; then
            echo "F.13 client/relay log exposed recovery request field"
            exit 1
          fi
          if grep -Fq "session_credential" "$client_log" || grep -Fq "session_credential" "$server_log" || grep -Fq "session_credential" "$relay_log"; then
            echo "F.13 captured logs unexpectedly exposed an issued bearer field"
            exit 1
          fi

          echo "ASTRAHOLD_F13_E2E_OK https_relay=true tls=1.3 bearer_credential_file=true idempotent_retry=true transient_retry=true permanent_no_retry=true unknown_no_delivery=true delivery_failure_generic=true inactive_challenge=true product_main=true fresh_login=true secret_safe_observability=true protocol=9"

      - name: Upload F.13 recovery delivery provider logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4f13-production-recovery-delivery-provider-logs
          path: |
            ${{ runner.temp }}/s4f13-worldd.log
            ${{ runner.temp }}/s4f13-product-main.log
