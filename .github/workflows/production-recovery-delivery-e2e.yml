name: Production Recovery Delivery E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  delivered-recovery-product-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - name: Checkout S4-F.11 client fence
        uses: actions/checkout@v4
        with:
          repository: li41/astrahold-client
          ref: 7cee7186efe470c8f8a8f678c32f9e049c87ce85
          path: .e2e-client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools and client
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .e2e-client rev-parse HEAD)" = "7cee7186efe470c8f8a8f678c32f9e049c87ce85"
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl
          dotnet restore .e2e-client/Astrahold.Client.csproj
          dotnet build .e2e-client/Astrahold.Client.csproj --configuration Debug --no-restore

      - name: Download official Godot 4.7.1 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/godot
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d .tools/godot
          GODOT="$(find .tools/godot -type f -name 'Godot_v4.7.1-stable_mono_linux*' ! -path '*/GodotSharp/*' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Run verified delivery and F.11 product recovery acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f12-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          provider_file="$data_root/recovery-provider.json"
          inbox_dir="$data_root/recovery-inbox"
          delivery_file="$inbox_dir/holder-ci-inbox.proof"
          server_log="$RUNNER_TEMP/s4f12-worldd.log"
          client_log="$RUNNER_TEMP/s4f12-product-main.log"
          throttle_server_log="$RUNNER_TEMP/s4f12-throttle-worldd.log"
          unknown_body="$RUNNER_TEMP/s4f12-unknown-request.json"
          failed_body="$RUNNER_TEMP/s4f12-failed-delivery-request.json"
          known_body="$RUNNER_TEMP/s4f12-known-delivery-request.json"
          invalid_unknown_body="$RUNNER_TEMP/s4f12-invalid-unknown.json"
          invalid_failed_body="$RUNNER_TEMP/s4f12-invalid-failed.json"
          invalid_wrong_body="$RUNNER_TEMP/s4f12-invalid-wrong.json"
          invalid_stale_body="$RUNNER_TEMP/s4f12-invalid-stale.json"
          old_login_body="$RUNNER_TEMP/s4f12-old-login.json"
          throttle_headers="$RUNNER_TEMP/s4f12-throttle.headers"
          throttle_body="$RUNNER_TEMP/s4f12-throttle.json"
          old_password="F12-Old-Correct-Horse-Battery-Staple!"
          new_password="F12-New-Correct-Horse-Battery-Staple!"
          throwaway_password="F12-Throwaway-New-Password-Only!"
          wrong_proof="F12-Wrong-Recovery-Proof!"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"
          install -d -m 700 "$inbox_dir"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' "$old_password" | "$ACCOUNTCTL" create \
            -path "$accounts_file" \
            -login holder \
            -character f12-character \
            -password-stdin

          python3 - "$provider_file" "$accounts_file" "$inbox_dir" <<'PY'
          import base64, hashlib, json, os, sys
          provider_path, account_path, inbox_dir = sys.argv[1:]
          with open(account_path, encoding="utf-8") as f:
              store = json.load(f)
          assert store["schema_version"] == 4
          account = store["accounts"][0]
          assert account["login_id"] == "holder"
          assert account["credential_version"] == 1
          key = hashlib.sha256(b"Astrahold S4-F.12 CI reference delivery key").digest()
          definition = {
              "schema_version": 2,
              "revision": "s4f12-provider-001",
              "proof_key_base64url": base64.urlsafe_b64encode(key).rstrip(b"=").decode("ascii"),
              "delivery": {
                  "adapter": "filesystem-reference-v1",
                  "revision": "s4f12-filesystem-001",
                  "inbox_dir": inbox_dir,
              },
              "subjects": [{
                  "login_id": "holder",
                  "destination": "holder-ci-inbox",
              }],
          }
          fd = os.open(provider_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as f:
              json.dump(definition, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          PY
          test "$(stat -c '%a' "$provider_file")" = "600"
          test "$(stat -c '%a' "$inbox_dir")" = "700"

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.12 CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF_EXT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF_EXT
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial \
            -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1
          chmod 600 "$tls_dir/ca.key" "$tls_dir/server.key" "$accounts_file" "$provider_file"

          cleanup() {
            set +e
            for pid in "${client_pid:-}" "${server_pid:-}" "${throttle_server_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"
            marker="$2"
            pid="$3"
            attempts="$4"
            i=0
            while [ "$i" -lt "$attempts" ]; do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process exited before marker: $marker"
                cat "$file" || true
                cat "$server_log" || true
                cat "$throttle_server_log" || true
                return 1
              fi
              sleep 0.1
              i=$((i + 1))
            done
            echo "timed out waiting for marker: $marker"
            cat "$file" || true
            cat "$server_log" || true
            cat "$throttle_server_log" || true
            return 1
          }

          wait_success() {
            pid="$1"
            label="$2"
            log_file="$3"
            set +e
            wait "$pid"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "$label failed with status $status"
              cat "$log_file" || true
              cat "$server_log" || true
              exit 1
            fi
          }

          start_worldd() {
            login_port="$1"
            game_port="$2"
            tcp_backend="$3"
            udp_backend="$4"
            recovery_ip_limit="$5"
            log_file="$6"
            state_prefix="$7"
            exec "$GITHUB_WORKSPACE/.tools/worldd" \
              -tcp "127.0.0.1:$tcp_backend" \
              -udp "127.0.0.1:$udp_backend" \
              -session-login-account-file "$accounts_file" \
              -session-login-tls-listen "127.0.0.1:$login_port" \
              -session-login-tls-cert "$tls_dir/server.crt" \
              -session-login-tls-key "$tls_dir/server.key" \
              -session-login-ip-max-attempts 50 \
              -session-login-ip-attempt-window 1m \
              -session-credential-ttl 5m \
              -session-recovery-provider-file "$provider_file" \
              -session-recovery-challenge-ttl 5m \
              -session-recovery-challenge-max-attempts 5 \
              -session-recovery-ip-max-attempts "$recovery_ip_limit" \
              -session-recovery-ip-attempt-window 1m \
              -trusted-tls-listen "127.0.0.1:$game_port" \
              -trusted-tls-cert "$tls_dir/server.crt" \
              -trusted-tls-key "$tls_dir/server.key" \
              -character-state-dir "$data_root/${state_prefix}-character-state" \
              -character-state-save-journal "$data_root/${state_prefix}-character-state-saves.journal" \
              -character-state-save-checkpoint "$data_root/${state_prefix}-character-state-saves.checkpoint.json" \
              -death-outcome-journal "$data_root/${state_prefix}-death-outcomes.journal" \
              -death-outcome-checkpoint "$data_root/${state_prefix}-death-outcomes.checkpoint.json" \
              -siege-ownership-dir "$data_root/${state_prefix}-siege-ownership" >"$log_file" 2>&1 &
            WORLD_PID=$!
          }

          start_worldd 39444 39443 39777 39778 50 "$server_log" delivery
          server_pid=$WORLD_PID
          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=11" "$server_pid" 300
          wait_for_marker "$server_log" "session login issuance: enabled=true revision=durable-2" "$server_pid" 300
          wait_for_marker "$server_log" "session recovery: enabled=true provider=hmac-sha256-generation-delivery revision=s4f12-provider-001" "$server_pid" 300

          unknown_status="$(printf '{"login_id":"missing-holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$unknown_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          test "$unknown_status" = "202"
          test ! -e "$delivery_file"

          chmod 500 "$inbox_dir"
          failed_status="$(printf '{"login_id":"holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$failed_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          chmod 700 "$inbox_dir"
          test "$failed_status" = "202"
          test ! -e "$delivery_file"

          known_status="$(printf '{"login_id":"holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$known_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/request)"
          test "$known_status" = "202"
          test -f "$delivery_file"
          test "$(stat -c '%a' "$delivery_file")" = "600"
          delivered_proof="$(tr -d '\n' < "$delivery_file")"
          test -n "$delivered_proof"
          test "$(wc -l < "$delivery_file")" -eq 1

          read -r unknown_request_id failed_request_id known_request_id < <(python3 - "$unknown_body" "$failed_body" "$known_body" <<'PY'
          import datetime, json, sys
          bodies = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as f:
                  body = json.load(f)
              assert set(body) == {"request_id", "expires_at"}
              assert isinstance(body["request_id"], str) and body["request_id"]
              assert isinstance(body["expires_at"], str) and body["expires_at"].endswith("Z")
              datetime.datetime.fromisoformat(body["expires_at"].replace("Z", "+00:00"))
              bodies.append(body)
          assert len({body["request_id"] for body in bodies}) == 3
          print(*(body["request_id"] for body in bodies))
          PY
          )
          test -n "$unknown_request_id"
          test -n "$failed_request_id"
          test -n "$known_request_id"
          echo "ASTRAHOLD_F12_ENUMERATION_SHAPE_OK unknown=202 delivery_failed=202 delivered=202 fields=request_id,expires_at"

          unknown_reset_status="$(printf '{"request_id":"%s","recovery_proof":"%s","new_password":"%s"}' \
            "$unknown_request_id" "$delivered_proof" "$throwaway_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$invalid_unknown_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/reset)"
          failed_reset_status="$(printf '{"request_id":"%s","recovery_proof":"%s","new_password":"%s"}' \
            "$failed_request_id" "$delivered_proof" "$throwaway_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$invalid_failed_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/reset)"
          wrong_reset_status="$(printf '{"request_id":"%s","recovery_proof":"%s","new_password":"%s"}' \
            "$known_request_id" "$wrong_proof" "$throwaway_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$invalid_wrong_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/reset)"
          test "$unknown_reset_status" = "401"
          test "$failed_reset_status" = "401"
          test "$wrong_reset_status" = "401"
          cmp "$invalid_unknown_body" "$invalid_failed_body"
          cmp "$invalid_unknown_body" "$invalid_wrong_body"
          grep -F '"error":"invalid_recovery"' "$invalid_unknown_body"

          ASTRAHOLD_SESSION_LOGIN_URL="https://localhost:39444" \
          ASTRAHOLD_SESSION_LOGIN_ID=holder \
          ASTRAHOLD_SERVER_HOST=127.0.0.1 \
          ASTRAHOLD_SERVER_PORT=39443 \
          ASTRAHOLD_TLS_SERVER_NAME=localhost \
          ASTRAHOLD_TLS_CA="$tls_dir/ca.crt" \
          ASTRAHOLD_F11_AUTOMATION_MODE=recovery \
          ASTRAHOLD_F11_AUTOMATION_RECOVERY_PROOF="$delivered_proof" \
          ASTRAHOLD_F11_AUTOMATION_NEW_SECRET="$new_password" \
          ASTRAHOLD_F11_AUTOMATION_LOGIN_SECRET="$new_password" \
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/.e2e-client" res://scenes/Main.tscn >"$client_log" 2>&1 &
          client_pid=$!

          wait_for_marker "$client_log" "ASTRAHOLD_F11_UNKNOWN_REQUEST_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_INVALID_RECOVERY_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_RESET_UI_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_RECOVERY_LOGIN_OK" "$client_pid" 600
          wait_for_marker "$client_log" "ASTRAHOLD_F11_CLIENT_RECOVERY_UX_OK" "$client_pid" 600
          wait_success "$client_pid" "F.12 delivered proof through F.11 product recovery UX" "$client_log"
          client_pid=""

          old_status="$(printf '{"login_id":"holder","login_secret":"%s"}' "$old_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$old_login_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/session/login)"
          test "$old_status" = "401"
          grep -F '"error":"invalid_credentials"' "$old_login_body"

          stale_status="$(printf '{"request_id":"%s","recovery_proof":"%s","new_password":"%s"}' \
            "$known_request_id" "$delivered_proof" "$throwaway_password" | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output "$invalid_stale_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:39444/v1/account/recovery/reset)"
          test "$stale_status" = "401"
          cmp "$invalid_unknown_body" "$invalid_stale_body"

          python3 - "$accounts_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              store = json.load(f)
          assert store["schema_version"] == 4
          account = store["accounts"][0]
          assert account["login_id"] == "holder"
          assert account["credential_version"] == 2
          assert not store.get("recovery_grants")
          print("ASTRAHOLD_F12_STORE_OK schema=4 credential_version=2")
          PY

          for secret in "$old_password" "$new_password" "$throwaway_password" "$wrong_proof" "$delivered_proof" \
                        "F11-Wrong-Recovery-Proof!" "F11-Throwaway-New-Password-Only!"; do
            if grep -Fq "$secret" "$client_log" || grep -Fq "$secret" "$server_log"; then
              echo "F.12 captured logs leaked recovery/password secret material"
              exit 1
            fi
          done
          for opaque_id in "$unknown_request_id" "$failed_request_id" "$known_request_id"; do
            if grep -Fq "$opaque_id" "$client_log" || grep -Fq "$opaque_id" "$server_log"; then
              echo "F.12 captured logs leaked opaque recovery request metadata"
              exit 1
            fi
          done
          if grep -Fq "session_credential" "$client_log" || grep -Fq "session_credential" "$server_log"; then
            echo "F.12 captured logs unexpectedly exposed an issued bearer field"
            exit 1
          fi

          kill -TERM "$server_pid" 2>/dev/null || true
          set +e
          wait "$server_pid"
          set -e
          server_pid=""

          start_worldd 40444 40443 40777 40778 1 "$throttle_server_log" throttle
          throttle_server_pid=$WORLD_PID
          wait_for_marker "$throttle_server_log" "Astrahold worldd ready: protocol=11" "$throttle_server_pid" 300
          wait_for_marker "$throttle_server_log" "session login issuance: enabled=true revision=durable-3" "$throttle_server_pid" 300
          wait_for_marker "$throttle_server_log" "session recovery: enabled=true provider=hmac-sha256-generation-delivery revision=s4f12-provider-001" "$throttle_server_pid" 300

          preburn_status="$(printf '{"login_id":"missing-holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:40444/v1/account/recovery/request)"
          test "$preburn_status" = "202"

          throttle_status="$(printf '{"login_id":"holder"}' | curl --silent --show-error \
            --cacert "$tls_dir/ca.crt" --dump-header "$throttle_headers" --output "$throttle_body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://localhost:40444/v1/account/recovery/request)"
          test "$throttle_status" = "429"
          grep -F '"error":"recovery_throttled"' "$throttle_body"
          tr -d '\r' < "$throttle_headers" | grep -Eq '^Retry-After: [1-9][0-9]*$'

          for secret in "$old_password" "$new_password" "$throwaway_password" "$wrong_proof" "$delivered_proof"; do
            if grep -Fq "$secret" "$throttle_server_log"; then
              echo "F.12 throttle server log leaked secret material"
              exit 1
            fi
          done

          echo "ASTRAHOLD_F12_E2E_OK delivery_adapter=true destination_server_owned=true unknown_no_delivery=true delivery_failure_generic=true inactive_challenge=true delivered_proof_main_ui=true wrong_proof_generic=true stale_generation_rejected=true old_password_rejected=true fresh_login=true throttle_retry_after=true secrets_not_logged=true protocol=11 tls=1.3"

      - name: Upload F.12 recovery delivery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4f12-production-recovery-delivery-logs
          path: |
            ${{ runner.temp }}/s4f12-worldd.log
            ${{ runner.temp }}/s4f12-product-main.log
            ${{ runner.temp }}/s4f12-throttle-worldd.log
          if-no-files-found: warn