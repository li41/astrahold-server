name: Production Trusted Proxy Edge Binding Retirement E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  trusted-proxy-edge-binding-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl

      - name: Run binding-aware edge retirement acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f22-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          edge_policy="$data_root/edge-policy.json"
          server_log="$RUNNER_TEMP/s4f22-worldd.log"
          holder_log="$RUNNER_TEMP/s4f22-holder.log"
          holder_script="$RUNNER_TEMP/s4f22-holder.py"
          holder_ready="$RUNNER_TEMP/s4f22-holder.ready"
          selective_go="$RUNNER_TEMP/s4f22-selective.go"
          global_go="$RUNNER_TEMP/s4f22-global.go"
          wrong_password="F22-Wrong-Password-Should-Not-Log!"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          rm -f "$holder_ready" "$selective_go" "$global_go"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' 'F22-Correct-Horse-Battery-Staple!' | "$ACCOUNTCTL" create \
            -path "$accounts_file" \
            -login holder \
            -character f22-character \
            -password-stdin

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-ca.key" -out "$tls_dir/server-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.22 Server CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF_SERVER_EXT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF_SERVER_EXT
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/server-ca.crt" -CAkey "$tls_dir/server-ca.key" -CAcreateserial \
            -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/edge-ca.key" -out "$tls_dir/edge-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.22 Edge CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1

          make_edge_cert() {
            label="$1"
            dns_name="$2"
            openssl req -newkey rsa:2048 -nodes \
              -keyout "$tls_dir/edge-$label.key" -out "$tls_dir/edge-$label.csr" \
              -subj "/CN=$dns_name" >/dev/null 2>&1
            cat >"$tls_dir/edge-$label.ext" <<EOF_EDGE_EXT
          subjectAltName=DNS:$dns_name
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          EOF_EDGE_EXT
            openssl x509 -req -in "$tls_dir/edge-$label.csr" \
              -CA "$tls_dir/edge-ca.crt" -CAkey "$tls_dir/edge-ca.key" -CAcreateserial \
              -out "$tls_dir/edge-$label.crt" -days 1 -sha256 -extfile "$tls_dir/edge-$label.ext" >/dev/null 2>&1
          }
          make_edge_cert a edge-a.astrahold.test
          make_edge_cert a2 edge-a2.astrahold.test
          make_edge_cert b edge-b.astrahold.test

          write_edge_policy() {
            mode="$1"
            python3 - "$edge_policy" "$mode" <<'PY'
          import json, os, sys
          path, mode = sys.argv[1:]
          if mode == "1":
              document = {
                  "schema_version": 1,
                  "revision": "edge-001",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a.astrahold.test"]},
                      {"prefixes": ["127.0.0.3/32"], "dns_names": ["edge-b.astrahold.test"]},
                  ],
              }
          elif mode == "2":
              document = {
                  "schema_version": 1,
                  "revision": "edge-002",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a2.astrahold.test"]},
                      {"prefixes": ["127.0.0.3/32"], "dns_names": ["edge-b.astrahold.test"]},
                  ],
              }
          elif mode == "3":
              document = {
                  "schema_version": 1,
                  "revision": "edge-003",
                  "forwarded_header": "forwarded",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a2.astrahold.test"]},
                      {"prefixes": ["127.0.0.3/32"], "dns_names": ["edge-b.astrahold.test"]},
                  ],
              }
          else:
              document = {
                  "schema_version": 1,
                  "revision": "edge-invalid",
                  "forwarded_header": "forwarded",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.0/8"], "dns_names": ["bad-a.astrahold.test"]},
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["bad-b.astrahold.test"]},
                  ],
              }
          temp = path + ".tmp"
          with open(temp, "w", encoding="utf-8") as f:
              json.dump(document, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          os.replace(temp, path)
          os.chmod(path, 0o600)
          PY
          }
          write_edge_policy 1
          chmod 600 "$accounts_file" "$edge_policy" "$tls_dir"/*.key

          cat >"$holder_script" <<'PY'
          import http.client
          import os
          import ssl
          import sys
          import time

          server_ca, cert_a, key_a, cert_b, key_b, ready, selective_go, global_go = sys.argv[1:]

          def make_connection(source, cert, key):
              context = ssl.create_default_context(cafile=server_ca)
              context.minimum_version = ssl.TLSVersion.TLSv1_3
              context.load_cert_chain(certfile=cert, keyfile=key)
              return http.client.HTTPSConnection(
                  "127.0.0.1", 39444, context=context,
                  source_address=(source, 0), timeout=5,
              )

          a = make_connection("127.0.0.2", cert_a, key_a)
          b = make_connection("127.0.0.3", cert_b, key_b)

          def request(connection, source, header="X-Forwarded-For"):
              body = b'{"login_id":"holder","login_secret":"F22-holder-wrong"}'
              value = f"for={source}" if header == "Forwarded" else source
              connection.request("POST", "/v1/session/login", body=body, headers={
                  "Content-Type": "application/json",
                  header: value,
              })
              response = connection.getresponse()
              response.read()
              return response.status

          assert request(a, "198.51.100.110") == 401
          assert request(b, "198.51.100.120") == 401
          with open(ready, "w", encoding="utf-8") as f:
              f.write("ready\n")

          for _ in range(300):
              if os.path.exists(selective_go):
                  break
              time.sleep(0.1)
          else:
              raise RuntimeError("timed out waiting for selective cutover")

          try:
              status = request(a, "198.51.100.111")
          except Exception:
              print("ASTRAHOLD_F22_CHANGED_BINDING_RETIRED", flush=True)
          else:
              raise RuntimeError(f"changed binding unexpectedly survived with HTTP {status}")

          assert request(b, "198.51.100.121") == 401
          print("ASTRAHOLD_F22_UNAFFECTED_BINDING_SURVIVES", flush=True)

          for _ in range(300):
              if os.path.exists(global_go):
                  break
              time.sleep(0.1)
          else:
              raise RuntimeError("timed out waiting for global cutover")

          # After the global header cutover, the old keep-alive must not retain
          # its pinned XFF authority. A client-library reconnect may succeed at
          # TLS because edge-b is still allowed, but then the old XFF request
          # must observe the new policy and return 400 instead of old 401.
          try:
              status = request(b, "198.51.100.122")
          except Exception:
              print("ASTRAHOLD_F22_GLOBAL_CUTOVER_RETIRES_REMAINING", flush=True)
          else:
              if status != 400:
                  raise RuntimeError(f"global cutover old connection retained authority with HTTP {status}")
              print("ASTRAHOLD_F22_GLOBAL_CUTOVER_RETIRES_REMAINING", flush=True)

          a.close()
          b.close()
          PY

          cleanup() {
            set +e
            for pid in "${holder_pid:-}" "${server_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"
            marker="$2"
            pid="$3"
            for _ in $(seq 1 300); do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process exited before marker: $marker"
                cat "$file" || true
                cat "$server_log" || true
                return 1
              fi
              sleep 0.1
            done
            echo "timed out waiting for marker: $marker"
            cat "$file" || true
            cat "$server_log" || true
            return 1
          }

          wait_for_file() {
            path="$1"
            pid="$2"
            log="$3"
            for _ in $(seq 1 300); do
              if [ -f "$path" ]; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log" || true; return 1; fi
              sleep 0.1
            done
            echo "timed out waiting for $path"
            cat "$log" || true
            return 1
          }

          "$GITHUB_WORKSPACE/.tools/worldd" \
            -tcp 127.0.0.1:39777 \
            -udp 127.0.0.1:39778 \
            -session-login-account-file "$accounts_file" \
            -session-login-tls-listen 127.0.0.1:39444 \
            -session-login-tls-cert "$tls_dir/server.crt" \
            -session-login-tls-key "$tls_dir/server.key" \
            -session-login-trusted-proxy-edge-policy-file "$edge_policy" \
            -session-login-trusted-proxy-edge-retire-old-connections \
            -session-login-ip-max-attempts 100 \
            -session-login-ip-attempt-window 1m \
            -character-state-dir "$data_root/character-state" \
            -character-state-save-journal "$data_root/character-state-saves.journal" \
            -character-state-save-checkpoint "$data_root/character-state-saves.checkpoint.json" \
            -death-outcome-journal "$data_root/death-outcomes.journal" \
            -death-outcome-checkpoint "$data_root/death-outcomes.checkpoint.json" \
            -siege-ownership-dir "$data_root/siege-ownership" >"$server_log" 2>&1 &
          server_pid=$!

          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=11" "$server_pid"
          wait_for_marker "$server_log" "edge_policy_generation=1 edge_policy_revision=edge-001 edge_policy_bindings=2 edge_policy_connection_cutover=retire-old" "$server_pid"

          python3 "$holder_script" \
            "$tls_dir/server-ca.crt" \
            "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" \
            "$tls_dir/edge-b.crt" "$tls_dir/edge-b.key" \
            "$holder_ready" "$selective_go" "$global_go" >"$holder_log" 2>&1 &
          holder_pid=$!
          wait_for_file "$holder_ready" "$holder_pid" "$holder_log"

          # Binding-local authority change: same header, same CA roots, same
          # trusted prefix topology; only .2 moves edge-a -> edge-a2.
          write_edge_policy 2
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload applied: previous_generation=1 generation=2 previous_revision=edge-001 revision=edge-002 previous_header=x-forwarded-for header=x-forwarded-for roots=1 bindings=2 prefixes=2 identities=2 connection_cutover=retire-old retired_connections=1" "$server_pid"
          touch "$selective_go"
          wait_for_marker "$holder_log" "ASTRAHOLD_F22_CHANGED_BINDING_RETIRED" "$holder_pid"
          wait_for_marker "$holder_log" "ASTRAHOLD_F22_UNAFFECTED_BINDING_SURVIVES" "$holder_pid"

          login_body="$(printf '{"login_id":"holder","login_secret":"%s"}' "$wrong_password")"

          set +e
          printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-a.crt" --key "$tls_dir/edge-a.key" \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.112' \
            --data-binary @- https://localhost:39444/v1/session/login >/tmp/f22-old-a 2>/tmp/f22-old-a.err
          old_a_rc=$?
          set -e
          test "$old_a_rc" -ne 0

          new_a_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-a2.crt" --key "$tls_dir/edge-a2.key" \
            --output /tmp/f22-new-a --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.113' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$new_a_status" = "401"

          b_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.3 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-b.crt" --key "$tls_dir/edge-b.key" \
            --output /tmp/f22-new-b --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.123' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$b_status" = "401"

          # Global authority change: header mode changes for every binding.
          write_edge_policy 3
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload applied: previous_generation=2 generation=3 previous_revision=edge-002 revision=edge-003 previous_header=x-forwarded-for header=forwarded roots=1 bindings=2 prefixes=2 identities=2 connection_cutover=retire-old retired_connections=1" "$server_pid"
          touch "$global_go"
          wait "$holder_pid"
          holder_pid=""
          grep -F "ASTRAHOLD_F22_GLOBAL_CUTOVER_RETIRES_REMAINING" "$holder_log"

          fresh_b_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.3 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-b.crt" --key "$tls_dir/edge-b.key" \
            --output /tmp/f22-fresh-b --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.124' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$fresh_b_status" = "401"

          # Invalid replacement must retain generation-3 LKG and retire nobody.
          write_edge_policy invalid
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload rejected; last-known-good retained: generation=3 revision=edge-003 header=forwarded bindings=2" "$server_pid"

          lkg_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.3 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-b.crt" --key "$tls_dir/edge-b.key" \
            --output /tmp/f22-lkg --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.125' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$lkg_status" = "401"

          # Direct/untrusted Godot-style Client path remains server-auth-only;
          # forged forwarding metadata still has no authority.
          direct_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --cacert "$tls_dir/server-ca.crt" --output /tmp/f22-direct --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=203.0.113.250' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$direct_status" = "401"

          grep -F "ASTRAHOLD_F22_CHANGED_BINDING_RETIRED" "$holder_log"
          grep -F "ASTRAHOLD_F22_UNAFFECTED_BINDING_SURVIVES" "$holder_log"
          grep -F "ASTRAHOLD_F22_GLOBAL_CUTOVER_RETIRES_REMAINING" "$holder_log"

          if grep -Fq "$wrong_password" "$server_log" "$holder_log"; then
            echo "secret leaked to F.22 logs"
            exit 1
          fi
          if grep -Eq '198\.51\.100\.(110|111|112|113|120|121|122|123|124|125)|203\.0\.113\.250' "$server_log"; then
            echo "source address leaked to worldd log"
            exit 1
          fi

          echo "ASTRAHOLD_F22_E2E_OK selective_retirement=true unaffected_binding_survives=true global_cutover=true invalid_lkg=true direct_client_unchanged=true protocol=11 tls=1.3"

      - name: Upload F.22 binding retirement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4f22-edge-binding-retirement-logs
          path: |
            ${{ runner.temp }}/s4f22-worldd.log
            ${{ runner.temp }}/s4f22-holder.log
          if-no-files-found: warn
