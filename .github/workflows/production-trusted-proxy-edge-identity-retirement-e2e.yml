name: Production Trusted Proxy Edge Identity Retirement E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  trusted-proxy-edge-identity-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl

      - name: Run identity-aware edge retirement acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f23-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          edge_policy="$data_root/edge-policy.json"
          server_log="$RUNNER_TEMP/s4f23-worldd.log"
          holder_log="$RUNNER_TEMP/s4f23-holder.log"
          holder_script="$RUNNER_TEMP/s4f23-holder.py"
          holder_ready="$RUNNER_TEMP/s4f23-holder.ready"
          phase2_go="$RUNNER_TEMP/s4f23-phase2.go"
          phase2_done="$RUNNER_TEMP/s4f23-phase2.done"
          phase3_go="$RUNNER_TEMP/s4f23-phase3.go"
          phase3_done="$RUNNER_TEMP/s4f23-phase3.done"
          wrong_password="F23-Wrong-Password-Should-Not-Log!"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          rm -f "$holder_ready" "$phase2_go" "$phase2_done" "$phase3_go" "$phase3_done"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' 'F23-Correct-Horse-Battery-Staple!' | "$ACCOUNTCTL" create \
            -path "$accounts_file" \
            -login holder \
            -character f23-character \
            -password-stdin

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-ca.key" -out "$tls_dir/server-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.23 Server CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF_SERVER_EXT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF_SERVER_EXT
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/server-ca.crt" -CAkey "$tls_dir/server-ca.key" -CAcreateserial \
            -out "$tls_dir/server.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/edge-ca.key" -out "$tls_dir/edge-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.23 Edge CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1

          make_edge_cert() {
            label="$1"
            common_name="$2"
            san_spec="$3"
            openssl req -newkey rsa:2048 -nodes \
              -keyout "$tls_dir/edge-$label.key" -out "$tls_dir/edge-$label.csr" \
              -subj "/CN=$common_name" >/dev/null 2>&1
            cat >"$tls_dir/edge-$label.ext" <<EOF_EDGE_EXT
          subjectAltName=$san_spec
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          EOF_EDGE_EXT
            openssl x509 -req -in "$tls_dir/edge-$label.csr" \
              -CA "$tls_dir/edge-ca.crt" -CAkey "$tls_dir/edge-ca.key" -CAcreateserial \
              -out "$tls_dir/edge-$label.crt" -days 1 -sha256 -extfile "$tls_dir/edge-$label.ext" >/dev/null 2>&1
          }
          make_edge_cert a edge-a.astrahold.test "DNS:edge-a.astrahold.test"
          make_edge_cert canary edge-canary.astrahold.test "DNS:edge-canary.astrahold.test"
          make_edge_cert multi edge-a.astrahold.test "DNS:edge-a.astrahold.test,DNS:edge-future.astrahold.test"
          make_edge_cert next edge-next.astrahold.test "DNS:edge-next.astrahold.test"

          write_edge_policy() {
            mode="$1"
            python3 - "$edge_policy" "$mode" <<'PY'
          import json, os, sys
          path, mode = sys.argv[1:]
          if mode == "1":
              document = {
                  "schema_version": 1,
                  "revision": "edge-001",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a.astrahold.test", "edge-canary.astrahold.test"]},
                  ],
              }
          elif mode == "2":
              document = {
                  "schema_version": 1,
                  "revision": "edge-002",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a.astrahold.test", "edge-next.astrahold.test"]},
                  ],
              }
          elif mode == "3":
              document = {
                  "schema_version": 1,
                  "revision": "edge-003",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-future.astrahold.test", "edge-next.astrahold.test"]},
                  ],
              }
          else:
              document = {
                  "schema_version": 1,
                  "revision": "edge-invalid",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.0/8"], "dns_names": ["bad-a.astrahold.test"]},
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["bad-b.astrahold.test"]},
                  ],
              }
          temp = path + ".tmp"
          with open(temp, "w", encoding="utf-8") as f:
              json.dump(document, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          os.replace(temp, path)
          os.chmod(path, 0o600)
          PY
          }
          write_edge_policy 1
          chmod 600 "$accounts_file" "$edge_policy" "$tls_dir"/*.key

          cat >"$holder_script" <<'PY'
          import http.client
          import os
          import select
          import ssl
          import sys
          import time

          server_ca, cert_a, key_a, cert_canary, key_canary, cert_multi, key_multi, ready, phase2_go, phase2_done, phase3_go, phase3_done = sys.argv[1:]

          def make_connection(cert, key):
              context = ssl.create_default_context(cafile=server_ca)
              context.minimum_version = ssl.TLSVersion.TLSv1_3
              context.load_cert_chain(certfile=cert, keyfile=key)
              return http.client.HTTPSConnection(
                  "127.0.0.1", 39544, context=context,
                  source_address=("127.0.0.2", 0), timeout=5,
              )

          def request(connection, source):
              body = b'{"login_id":"holder","login_secret":"F23-Wrong-Password-Should-Not-Log!"}'
              connection.request("POST", "/v1/session/login", body=body, headers={
                  "Content-Type": "application/json",
                  "X-Forwarded-For": source,
              })
              response = connection.getresponse()
              response.read()
              return response.status

          def local_port(connection):
              if connection.sock is None:
                  raise RuntimeError("connection has no live socket")
              return connection.sock.getsockname()[1]

          def wait_closed(connection, label):
              sock = connection.sock
              if sock is None:
                  return
              deadline = time.time() + 5
              while time.time() < deadline:
                  readable, _, _ = select.select([sock], [], [], 0.1)
                  if not readable:
                      continue
                  try:
                      data = sock.recv(1)
                  except Exception:
                      return
                  if data == b'':
                      return
                  raise RuntimeError(f"{label} received unexpected server data while waiting for close")
              raise RuntimeError(f"{label} was not retired")

          def assert_open(connection, label):
              sock = connection.sock
              if sock is None:
                  raise RuntimeError(f"{label} lost its socket")
              readable, _, _ = select.select([sock], [], [], 0.4)
              if readable:
                  try:
                      data = sock.recv(1)
                  except Exception as exc:
                      raise RuntimeError(f"{label} was unexpectedly retired: {exc}") from exc
                  if data == b'':
                      raise RuntimeError(f"{label} was unexpectedly retired")
                  raise RuntimeError(f"{label} had unexpected pending server data")

          a = make_connection(cert_a, key_a)
          canary = make_connection(cert_canary, key_canary)
          multi = make_connection(cert_multi, key_multi)
          assert request(a, "198.51.100.130") == 401
          assert request(canary, "198.51.100.131") == 401
          assert request(multi, "198.51.100.132") == 401
          a_port = local_port(a)
          multi_port = local_port(multi)
          with open(ready, "w", encoding="utf-8") as f:
              f.write("ready\n")

          for _ in range(300):
              if os.path.exists(phase2_go):
                  break
              time.sleep(0.1)
          else:
              raise RuntimeError("timed out waiting for phase 2")

          wait_closed(canary, "removed canary identity")
          assert_open(a, "retained edge-a identity")
          assert_open(multi, "multi-SAN connection matched through edge-a")
          assert request(a, "198.51.100.133") == 401
          assert request(multi, "198.51.100.134") == 401
          if local_port(a) != a_port or local_port(multi) != multi_port:
              raise RuntimeError("retained identity connection silently reconnected")
          print("ASTRAHOLD_F23_PARTIAL_ROTATION_OK", flush=True)
          with open(phase2_done, "w", encoding="utf-8") as f:
              f.write("done\n")

          for _ in range(300):
              if os.path.exists(phase3_go):
                  break
              time.sleep(0.1)
          else:
              raise RuntimeError("timed out waiting for phase 3")

          wait_closed(a, "edge-a identity after removal")
          wait_closed(multi, "multi-SAN connection after original matched identity removal")
          print("ASTRAHOLD_F23_MULTI_SAN_NO_RETROACTIVE_PROMOTION", flush=True)
          with open(phase3_done, "w", encoding="utf-8") as f:
              f.write("done\n")

          a.close()
          canary.close()
          multi.close()
          PY

          cleanup() {
            set +e
            for pid in "${holder_pid:-}" "${server_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"
            marker="$2"
            pid="$3"
            for _ in $(seq 1 300); do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process exited before marker: $marker"
                cat "$file" || true
                cat "$server_log" || true
                return 1
              fi
              sleep 0.1
            done
            echo "timed out waiting for marker: $marker"
            cat "$file" || true
            cat "$server_log" || true
            return 1
          }

          wait_for_file() {
            path="$1"
            pid="$2"
            log="$3"
            for _ in $(seq 1 300); do
              if [ -f "$path" ]; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log" || true; return 1; fi
              sleep 0.1
            done
            echo "timed out waiting for $path"
            cat "$log" || true
            return 1
          }

          "$GITHUB_WORKSPACE/.tools/worldd" \
            -tcp 127.0.0.1:39877 \
            -udp 127.0.0.1:39878 \
            -session-login-account-file "$accounts_file" \
            -session-login-tls-listen 127.0.0.1:39544 \
            -session-login-tls-cert "$tls_dir/server.crt" \
            -session-login-tls-key "$tls_dir/server.key" \
            -session-login-trusted-proxy-edge-policy-file "$edge_policy" \
            -session-login-trusted-proxy-edge-retire-old-connections \
            -session-login-ip-max-attempts 100 \
            -session-login-ip-attempt-window 1m \
            -character-state-dir "$data_root/character-state" \
            -character-state-save-journal "$data_root/character-state-saves.journal" \
            -character-state-save-checkpoint "$data_root/character-state-saves.checkpoint.json" \
            -death-outcome-journal "$data_root/death-outcomes.journal" \
            -death-outcome-checkpoint "$data_root/death-outcomes.checkpoint.json" \
            -siege-ownership-dir "$data_root/siege-ownership" >"$server_log" 2>&1 &
          server_pid=$!

          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=11" "$server_pid"
          wait_for_marker "$server_log" "edge_policy_generation=1 edge_policy_revision=edge-001 edge_policy_bindings=1 edge_policy_connection_cutover=retire-old" "$server_pid"

          python3 "$holder_script" \
            "$tls_dir/server-ca.crt" \
            "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" \
            "$tls_dir/edge-canary.crt" "$tls_dir/edge-canary.key" \
            "$tls_dir/edge-multi.crt" "$tls_dir/edge-multi.key" \
            "$holder_ready" "$phase2_go" "$phase2_done" "$phase3_go" "$phase3_done" >"$holder_log" 2>&1 &
          holder_pid=$!
          wait_for_file "$holder_ready" "$holder_pid" "$holder_log"

          # Same header, CA roots and prefix topology; only one identity is
          # removed from the existing binding while edge-a remains allowed.
          write_edge_policy 2
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload applied: previous_generation=1 generation=2 previous_revision=edge-001 revision=edge-002 previous_header=x-forwarded-for header=x-forwarded-for roots=1 bindings=1 prefixes=1 identities=2 connection_cutover=retire-old retired_connections=1" "$server_pid"
          touch "$phase2_go"
          wait_for_file "$phase2_done" "$holder_pid" "$holder_log"
          wait_for_marker "$holder_log" "ASTRAHOLD_F23_PARTIAL_ROTATION_OK" "$holder_pid"

          login_body="$(printf '{"login_id":"holder","login_secret":"%s"}' "$wrong_password")"

          # Removed canary cannot establish a fresh handshake under generation 2.
          set +e
          printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-canary.crt" --key "$tls_dir/edge-canary.key" \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.135' \
            --data-binary @- https://localhost:39544/v1/session/login >/tmp/f23-old-canary 2>/tmp/f23-old-canary.err
          canary_rc=$?
          set -e
          test "$canary_rc" -ne 0

          next_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-next.crt" --key "$tls_dir/edge-next.key" \
            --output /tmp/f23-next --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.136' \
            --data-binary @- https://localhost:39544/v1/session/login)"
          test "$next_status" = "401"

          # edge-a is now removed. The pre-existing multi-SAN connection had
          # edge-future in its certificate, but edge-future was NOT accepted by
          # generation 1. It must therefore retire rather than be promoted.
          write_edge_policy 3
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload applied: previous_generation=2 generation=3 previous_revision=edge-002 revision=edge-003 previous_header=x-forwarded-for header=x-forwarded-for roots=1 bindings=1 prefixes=1 identities=2 connection_cutover=retire-old retired_connections=2" "$server_pid"
          touch "$phase3_go"
          wait_for_file "$phase3_done" "$holder_pid" "$holder_log"
          wait "$holder_pid"
          holder_pid=""
          grep -F "ASTRAHOLD_F23_MULTI_SAN_NO_RETROACTIVE_PROMOTION" "$holder_log"

          # A fresh handshake with the same multi-SAN certificate is valid now,
          # because generation 3 explicitly allows edge-future.
          fresh_multi_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-multi.crt" --key "$tls_dir/edge-multi.key" \
            --output /tmp/f23-fresh-multi --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.137' \
            --data-binary @- https://localhost:39544/v1/session/login)"
          test "$fresh_multi_status" = "401"

          # Invalid replacement retains generation-3 LKG and retires nobody.
          write_edge_policy invalid
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload rejected; last-known-good retained: generation=3 revision=edge-003 header=x-forwarded-for bindings=1" "$server_pid"

          lkg_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-next.crt" --key "$tls_dir/edge-next.key" \
            --output /tmp/f23-lkg --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.138' \
            --data-binary @- https://localhost:39544/v1/session/login)"
          test "$lkg_status" = "401"

          direct_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --cacert "$tls_dir/server-ca.crt" --output /tmp/f23-direct --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 203.0.113.251' \
            --data-binary @- https://localhost:39544/v1/session/login)"
          test "$direct_status" = "401"

          grep -F "ASTRAHOLD_F23_PARTIAL_ROTATION_OK" "$holder_log"
          grep -F "ASTRAHOLD_F23_MULTI_SAN_NO_RETROACTIVE_PROMOTION" "$holder_log"

          if grep -Fq "$wrong_password" "$server_log"; then
            echo "secret leaked to F.23 worldd log"
            exit 1
          fi
          if grep -Eq '198\.51\.100\.(130|131|132|133|134|135|136|137|138)|203\.0\.113\.251' "$server_log"; then
            echo "source address leaked to worldd log"
            exit 1
          fi

          echo "ASTRAHOLD_F23_E2E_OK partial_binding_rotation=true retained_identity_survives=true removed_identity_retired=true multi_san_no_retroactive_promotion=true invalid_lkg=true direct_client_unchanged=true protocol=11 tls=1.3"

      - name: Upload F.23 identity retirement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4f23-edge-identity-retirement-logs
          path: |
            ${{ runner.temp }}/s4f23-worldd.log
            ${{ runner.temp }}/s4f23-holder.log
          if-no-files-found: warn
