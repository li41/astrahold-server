name: worldd-browserws-patch-once

on:
  push:
    branches: [feat/worldd-browserws-mode]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldd-browserws-mode
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wire exclusive browserws-dev mode into worldd
        run: python3 .github/scripts/patch_worldd_browserws.py
      - name: Format
        run: gofmt -w cmd/worldd/main.go cmd/worldd/world_network.go cmd/worldd/world_network_test.go
      - name: Test worldd wiring
        run: go test ./cmd/worldd
      - name: Test Server
        run: go test ./...
      - name: Commit wiring and retire temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/worldd-browserws-patch-once.yml .github/scripts/patch_worldd_browserws.py
          git add cmd/worldd/main.go cmd/worldd/world_network.go cmd/worldd/world_network_test.go
          git commit -m "net: wire exclusive browserws-dev worldd mode"
          git push origin HEAD:feat/worldd-browserws-mode
