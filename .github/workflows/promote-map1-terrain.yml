name: Promote Map1 Terrain Binary

on:
  push:
    branches:
      - ai-working-gpt-server
    paths:
      - .github/workflows/promote-map1-terrain.yml

permissions:
  contents: write

concurrency:
  group: promote-map1-terrain
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          ref: ai-working-gpt-server
          fetch-depth: 0

      - name: Materialize pinned terrain bake source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=".tmp-map1-bake"
          mkdir -p "$root/tools/src/terrain" "$root/assets/environment/terrain/map1"

          fetch_blob() {
            sha="$1"
            dst="$2"
            python3 - "$sha" "$dst" <<'PY'
          import base64, json, os, pathlib, sys, urllib.request
          sha, dst = sys.argv[1], sys.argv[2]
          url = f"https://api.github.com/repos/li41/astrahold-server/git/blobs/{sha}"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          if payload.get("encoding") != "base64":
              raise SystemExit(f"unexpected blob encoding for {sha}: {payload.get('encoding')}")
          path = pathlib.Path(dst)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(payload["content"]))
          PY
          }

          # Exact source blobs copied from li41/astrahold-assets@
          # d2b4c6f0a3fa1b9da5959286336ebb944b52b75d into unreachable Server Git objects.
          fetch_blob a4f0a5eec06bafb4177c91eac9e9cf1287725a05 "$root/tools/src/terrain/field.ts"
          fetch_blob 31671956476f3e2cdab23ed578e46567b389f505 "$root/tools/src/terrain/layout.ts"
          fetch_blob 8ba3f1d91fcaa11c18424df096387ffa6567131b "$root/tools/src/terrain/collision.ts"
          fetch_blob c787db266f6810a0d3a6bc15ade1603e637f5166 "$root/tools/src/terrain/prefab.ts"
          fetch_blob 7a7b4bb7f6651be33631f2f9ce0bb0299472ba55 "$root/tools/src/terrain/recipe.ts"
          fetch_blob cd25cdaa340843351349fc2a053c61b829b0e069 "$root/tools/src/terrain/path-index.ts"
          fetch_blob 91851693c9fe811e065c5bcddc710dd022b72144 "$root/tools/src/terrain/path-smooth.ts"
          fetch_blob 92fa3300732fbb8f332358e5c02d929294787f5c "$root/tools/src/terrain/noise.ts"
          fetch_blob 44a0822d1b298e47cfb7ef4415993379e792cbb6 "$root/tools/src/terrain/world.ts"
          fetch_blob eb93e5b89a574981f2f0071fd643f4d27f4f7dd5 "$root/assets/environment/terrain/map1/recipe.json"
          fetch_blob 6304ec24a16fd6ef0cf8fc3f1dcdea78c67e89cd "$root/assets/environment/terrain/map1/world.json"
          fetch_blob 9bd9f75f0672515a79b25e40aabb88fa42c2f7a2 "$root/assets/environment/terrain/map1/layout.json"

      - name: Rebuild exact Map1 heightfield
        shell: bash
        run: |
          set -euo pipefail
          root=".tmp-map1-bake"
          printf '{"type":"module"}\\n' > "$root/package.json"
          cat > "$root/bake-map1.ts" <<'TS'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { bakeRecipe, baseFor, recipeLines, shellSampler } from "./tools/src/terrain/field";
          import {
            assertLayout,
            assertLayoutAgainst,
            foundationSurface,
            resolveFoundations,
          } from "./tools/src/terrain/layout";
          import { expandLayout } from "./tools/src/terrain/prefab";
          import { assertRecipe } from "./tools/src/terrain/recipe";
          import { assertWorld } from "./tools/src/terrain/world";
          
          const assetDir = path.resolve("assets/environment/terrain/map1");
          const recipeText = await readFile(path.join(assetDir, "recipe.json"), "utf8");
          const worldText = await readFile(path.join(assetDir, "world.json"), "utf8");
          const layoutText = await readFile(path.join(assetDir, "layout.json"), "utf8");
          const recipe: any = JSON.parse(recipeText);
          const world: any = JSON.parse(worldText);
          const layout: any = JSON.parse(layoutText);
          assertWorld(world);
          assertRecipe(recipe, world);
          assertLayout(layout);
          
          const expanded = expandLayout(layout, {});
          const layoutGround = assertLayoutAgainst(expanded, recipe);
          const shellSpec = layoutGround.shell;
          const foundations = resolveFoundations(
            layoutGround.spec,
            shellSampler(shellSpec, recipe.seed, recipeLines(recipe, world), baseFor(world, shellSpec)),
          );
          const shells = bakeRecipe(recipe, world);
          if (foundations.length > 0) {
            const surface = foundationSurface(foundations);
            for (const shell of shells) {
              if (shell.id !== layoutGround.spec.terrain.shell) continue;
              for (let iz = 0; iz < shell.samples.z; iz += 1) {
                const z = shell.origin.z - shell.size.z / 2 + iz * shell.step.z;
                for (let ix = 0; ix < shell.samples.x; ix += 1) {
                  const at = iz * shell.samples.x + ix;
                  const x = shell.origin.x - shell.size.x / 2 + ix * shell.step.x;
                  shell.heights[at] = Math.fround(surface.at(shell.heights[at]!, x, z));
                }
              }
            }
          }
          const land = shells.find((shell) => shell.id === "land");
          if (!land) throw new Error("map1 land shell missing");
          const bytes = new Uint8Array(land.heights.length * 4);
          const view = new DataView(bytes.buffer);
          for (let i = 0; i < land.heights.length; i += 1) {
            const value = land.heights[i]!;
            if (!Number.isFinite(value)) throw new Error(`non-finite height at ${i}`);
            view.setFloat32(i * 4, value, true);
          }
          await writeFile("land.bin", bytes);
          console.log(`size=${bytes.byteLength}`);
          console.log(`sha256=${createHash("sha256").update(bytes).digest("hex")}`);
          TS

          (
            cd "$root"
            npm exec --yes --package=tsx@4.20.5 -- tsx bake-map1.ts
          )

          src="$root/land.bin"
          test -f "$src"
          actual_size="$(wc -c < "$src" | tr -d ' ')"
          test "$actual_size" = "2255616"
          echo "eff137f190c02355ba775fa4ac3df9c958b87640af1c770e1fccc25718f678f0  $src" | sha256sum -c -

      - name: Promote verified binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worlds/castle-sandbox/terrain/map1
          cp .tmp-map1-bake/land.bin worlds/castle-sandbox/terrain/map1/land.bin
          rm -rf .tmp-map1-bake
          git rm .github/workflows/promote-map1-terrain.yml
          git config user.name "gpt-server"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worlds/castle-sandbox/terrain/map1/land.bin
          git commit -m "world: promote verified map1 terrain heightfield"
          git push origin HEAD:ai-working-gpt-server
