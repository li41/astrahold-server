name: Production Trusted Proxy Revocation Rollout E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  trusted-proxy-revocation-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl
          go build -o "$GITHUB_WORKSPACE/.tools/revocationctl" ./cmd/revocationctl

      - name: Run required-ack rollout acceptance
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s4f26"
          tls="$root/tls"
          shared="$root/shared"
          a="$root/a"
          b="$root/b"
          rm -rf "$root"
          mkdir -p "$tls" "$shared" "$a/character-state" "$b/character-state"

          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"
          REVOCATIONCTL="$GITHUB_WORKSPACE/.tools/revocationctl"
          "$ACCOUNTCTL" init -path "$shared/accounts.json"
          printf '%s\n' 'F26-Correct-Horse-Battery-Staple!' | "$ACCOUNTCTL" create -path "$shared/accounts.json" -login holder -character f26-character -password-stdin
          cp "$shared/accounts.json" "$a/accounts.json"
          cp "$shared/accounts.json" "$b/accounts.json"

          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls/server-ca.key" -out "$tls/server-ca.crt" -days 1 -sha256 -subj "/CN=Astrahold S4-F.26 Server CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout "$tls/server.key" -out "$tls/server.csr" -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls/server.ext" <<'CERT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          CERT
          openssl x509 -req -in "$tls/server.csr" -CA "$tls/server-ca.crt" -CAkey "$tls/server-ca.key" -CAcreateserial -out "$tls/server.crt" -days 1 -sha256 -extfile "$tls/server.ext" >/dev/null 2>&1

          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls/edge-ca.key" -out "$tls/edge-ca.crt" -days 1 -sha256 -subj "/CN=Astrahold S4-F.26 Edge CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          make_leaf() {
            label="$1"
            openssl req -newkey rsa:2048 -nodes -keyout "$tls/edge-$label.key" -out "$tls/edge-$label.csr" -subj "/CN=edge-a.astrahold.test" >/dev/null 2>&1
            cat >"$tls/edge-$label.ext" <<'CERT'
          subjectAltName=DNS:edge-a.astrahold.test
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          CERT
            openssl x509 -req -in "$tls/edge-$label.csr" -CA "$tls/edge-ca.crt" -CAkey "$tls/edge-ca.key" -CAcreateserial -out "$tls/edge-$label.crt" -days 1 -sha256 -extfile "$tls/edge-$label.ext" >/dev/null 2>&1
          }
          make_leaf a
          make_leaf b
          leaf_a_spki="$(openssl x509 -in "$tls/edge-a.crt" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          leaf_b_spki="$(openssl x509 -in "$tls/edge-b.crt" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$leaf_a_spki" != "$leaf_b_spki"

          cat >"$shared/edge-policy.json" <<EOF2
          {"schema_version":1,"revision":"edge-001","forwarded_header":"x-forwarded-for","client_ca_file":"../tls/edge-ca.crt","bindings":[{"prefixes":["127.0.0.2/32"],"dns_names":["edge-a.astrahold.test"]}]}
          EOF2

          make_plan() {
            name="$1"; epoch="$2"; revision="$3"; revoked="$4"; timeout="$5"; seconds="$6"
            python3 - "$root" "$name" "$epoch" "$revision" "$revoked" "$timeout" "$seconds" <<'PY'
          import datetime, json, os, sys
          root,name,epoch,revision,revoked,timeout,seconds=sys.argv[1:]
          valid=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=int(seconds))).replace(microsecond=0).isoformat().replace('+00:00','Z')
          source=f"candidate-{name}.json"
          plan=f"plan-{name}.json"
          values=[v for v in revoked.split(',') if v]
          with open(os.path.join(root,source),'w') as f:
              json.dump({"schema_version":1,"revision":revision,"revoked_spki_sha256":values},f,separators=(',',':')); f.write('\n')
          with open(os.path.join(root,plan),'w') as f:
              json.dump({
                  "schema_version":1,
                  "epoch":int(epoch),
                  "valid_until":valid,
                  "ack_timeout":timeout,
                  "poll_interval":"100ms",
                  "revocation_source_file":source,
                  "required_instances":[
                      {"instance_id":"instance-a","revocation_file":"a/revocations.json","distribution_file":"a/distribution.json","ack_file":"a/ack.json"},
                      {"instance_id":"instance-b","revocation_file":"b/revocations.json","distribution_file":"b/distribution.json","ack_file":"b/ack.json"},
                  ],
              },f,separators=(',',':')); f.write('\n')
          print(valid)
          PY
          }

          valid1="$(make_plan epoch1 1 leaf-001 '' 5s 180)"
          "$REVOCATIONCTL" publish -plan "$root/plan-epoch1.json" >"$root/publish1.json"
          python3 - "$root/publish1.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['status']=='published' and r['epoch']==1
          assert r['published_instances']==['instance-a','instance-b']
          PY
          chmod 600 "$a/accounts.json" "$b/accounts.json" "$shared/edge-policy.json" "$tls"/*.key

          cleanup() {
            set +e
            for pid in "${rollout_pid:-}" "${a_pid:-}" "${b_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          start_instance() {
            name="$1"; dir="$2"; login_port="$3"; tcp_port="$4"; udp_port="$5"; log="$6"
            "$GITHUB_WORKSPACE/.tools/worldd" \
              -tcp "127.0.0.1:$tcp_port" -udp "127.0.0.1:$udp_port" \
              -session-login-account-file "$dir/accounts.json" \
              -session-login-tls-listen "127.0.0.1:$login_port" \
              -session-login-tls-cert "$tls/server.crt" -session-login-tls-key "$tls/server.key" \
              -session-login-trusted-proxy-edge-policy-file "$shared/edge-policy.json" \
              -session-login-trusted-proxy-leaf-revocation-file "$dir/revocations.json" \
              -session-login-trusted-proxy-leaf-revocation-distribution-file "$dir/distribution.json" \
              -session-login-trusted-proxy-leaf-revocation-instance-id "$name" \
              -session-login-trusted-proxy-leaf-revocation-ack-file "$dir/ack.json" \
              -session-login-trusted-proxy-edge-retire-old-connections \
              -session-login-ip-max-attempts 1000 -session-login-ip-attempt-window 1m \
              -character-state-dir "$dir/character-state" \
              -character-state-save-journal "$dir/character-state-saves.journal" \
              -character-state-save-checkpoint "$dir/character-state-saves.checkpoint.json" \
              -death-outcome-journal "$dir/death-outcomes.journal" \
              -death-outcome-checkpoint "$dir/death-outcomes.checkpoint.json" \
              -siege-ownership-dir "$dir/siege-ownership" >"$log" 2>&1 &
            echo $!
          }
          a_log="$root/a.log"; b_log="$root/b.log"
          a_pid="$(start_instance instance-a "$a" 39751 39971 39972 "$a_log")"
          b_pid="$(start_instance instance-b "$b" 39752 39973 39974 "$b_log")"

          wait_marker() {
            file="$1"; marker="$2"; pid="$3"
            for _ in $(seq 1 300); do
              grep -Fq "$marker" "$file" 2>/dev/null && return 0
              if ! kill -0 "$pid" 2>/dev/null; then cat "$file"; return 1; fi
              sleep 0.1
            done
            cat "$file"; return 1
          }
          wait_epoch_file() {
            file="$1"; epoch="$2"
            python3 - "$file" "$epoch" <<'PY'
          import json,sys,time
          path,epoch=sys.argv[1],int(sys.argv[2])
          for _ in range(300):
              try:
                  if json.load(open(path))['epoch']==epoch: raise SystemExit(0)
              except (FileNotFoundError,json.JSONDecodeError,KeyError): pass
              time.sleep(.1)
          raise SystemExit(1)
          PY
          }
          wait_ack_epoch() {
            file="$1"; epoch="$2"
            python3 - "$file" "$epoch" <<'PY'
          import json,sys,time
          path,epoch=sys.argv[1],int(sys.argv[2])
          for _ in range(300):
              try:
                  if json.load(open(path))['epoch']==epoch: raise SystemExit(0)
              except (FileNotFoundError,json.JSONDecodeError,KeyError): pass
              time.sleep(.1)
          raise SystemExit(1)
          PY
          }

          wait_marker "$a_log" "session trusted proxy leaf revocation distribution: enabled=true instance_id=instance-a epoch=1" "$a_pid"
          wait_marker "$b_log" "session trusted proxy leaf revocation distribution: enabled=true instance_id=instance-b epoch=1" "$b_pid"
          wait_marker "$a_log" "Astrahold worldd ready: protocol=9" "$a_pid"
          wait_marker "$b_log" "Astrahold worldd ready: protocol=9" "$b_pid"
          "$REVOCATIONCTL" wait -plan "$root/plan-epoch1.json" >"$root/wait1.json"
          python3 - "$root/wait1.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['status']=='converged' and r['acknowledged_instances']==['instance-a','instance-b']
          PY

          request() {
            port="$1"; cert="$2"; key="$3"; source="$4"
            python3 - "$tls/server-ca.crt" "$cert" "$key" "$port" "$source" <<'PY'
          import http.client, ssl, sys
          ca,cert,key,port,source=sys.argv[1:]
          ctx=ssl.create_default_context(cafile=ca); ctx.minimum_version=ssl.TLSVersion.TLSv1_3
          if cert: ctx.load_cert_chain(cert,key)
          kwargs={"context":ctx,"timeout":5}
          if source: kwargs["source_address"]=(source,0)
          c=http.client.HTTPSConnection('127.0.0.1',int(port),**kwargs)
          try:
              headers={"Content-Type":"application/json"}
              if source == '127.0.0.2': headers["X-Forwarded-For"]='198.51.100.252'
              c.request('POST','/v1/session/login',body=b'{"login_id":"holder","login_secret":"wrong"}',headers=headers)
              r=c.getresponse(); r.read(); print(r.status)
          except Exception:
              print('TLS_FAIL')
          finally:
              c.close()
          PY
          }

          test "$(request 39751 "$tls/edge-a.crt" "$tls/edge-a.key" 127.0.0.2)" = 401
          test "$(request 39752 "$tls/edge-a.crt" "$tls/edge-a.key" 127.0.0.2)" = 401

          valid2="$(make_plan epoch2 2 leaf-002 "$leaf_a_spki" 10s 180)"
          set +e
          "$REVOCATIONCTL" rollout -plan "$root/plan-epoch2.json" >"$root/rollout2.json" 2>"$root/rollout2.err" &
          rollout_pid=$!
          set -e
          wait_epoch_file "$a/distribution.json" 2
          wait_epoch_file "$b/distribution.json" 2
          kill -HUP "$a_pid"
          wait_marker "$a_log" "session trusted proxy leaf revocation distribution reload: epoch=2 valid_until=$valid2 ack=ok" "$a_pid"
          wait_ack_epoch "$a/ack.json" 2
          kill -0 "$rollout_pid"
          python3 - "$b/ack.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['epoch']==1
          PY
          test "$(request 39751 "$tls/edge-a.crt" "$tls/edge-a.key" 127.0.0.2)" = TLS_FAIL
          test "$(request 39751 "$tls/edge-b.crt" "$tls/edge-b.key" 127.0.0.2)" = 401
          test "$(request 39752 "$tls/edge-a.crt" "$tls/edge-a.key" 127.0.0.2)" = 401

          kill -HUP "$b_pid"
          wait_marker "$b_log" "session trusted proxy leaf revocation distribution reload: epoch=2 valid_until=$valid2 ack=ok" "$b_pid"
          set +e
          wait "$rollout_pid"
          rollout_code=$?
          set -e
          rollout_pid=""
          test "$rollout_code" -eq 0
          python3 - "$root/rollout2.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['status']=='converged' and r['epoch']==2
          assert r['required_instances']==['instance-a','instance-b']
          assert r['acknowledged_instances']==['instance-a','instance-b']
          PY
          test "$(request 39752 "$tls/edge-a.crt" "$tls/edge-a.key" 127.0.0.2)" = TLS_FAIL
          test "$(request 39752 "$tls/edge-b.crt" "$tls/edge-b.key" 127.0.0.2)" = 401
          test "$(request 39751 '' '' '')" = 401
          test "$(request 39752 '' '' '')" = 401

          valid3="$(make_plan epoch3 3 leaf-003 "$leaf_a_spki" 2s 180)"
          set +e
          "$REVOCATIONCTL" rollout -plan "$root/plan-epoch3.json" >"$root/rollout3.json" 2>"$root/rollout3.err" &
          rollout_pid=$!
          set -e
          wait_epoch_file "$a/distribution.json" 3
          wait_epoch_file "$b/distribution.json" 3
          kill -HUP "$a_pid"
          wait_marker "$a_log" "session trusted proxy leaf revocation distribution reload: epoch=3 valid_until=$valid3 ack=ok" "$a_pid"
          set +e
          wait "$rollout_pid"
          rollout_code=$?
          set -e
          rollout_pid=""
          test "$rollout_code" -eq 2
          python3 - "$root/rollout3.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['status']=='incomplete' and r['reason']=='timeout'
          assert r['acknowledged_instances']==['instance-a'] and r['pending_instances']==['instance-b']
          PY
          python3 - "$b/ack.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['epoch']==2
          PY

          kill -HUP "$b_pid"
          wait_marker "$b_log" "session trusted proxy leaf revocation distribution reload: epoch=3 valid_until=$valid3 ack=ok" "$b_pid"
          "$REVOCATIONCTL" wait -plan "$root/plan-epoch3.json" >"$root/wait3.json"
          python3 - "$root/wait3.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['status']=='converged' and r['acknowledged_instances']==['instance-a','instance-b']
          PY

          make_plan rollback 2 leaf-rollback "$leaf_a_spki" 2s 180 >/dev/null
          set +e
          "$REVOCATIONCTL" publish -plan "$root/plan-rollback.json" >"$root/rollback.json" 2>"$root/rollback.err"
          rollback_code=$?
          set -e
          test "$rollback_code" -eq 1
          grep -Fq 'newer epoch 3' "$root/rollback.err"
          python3 - "$a/distribution.json" "$b/distribution.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['epoch']==3
          assert json.load(open(sys.argv[2]))['epoch']==3
          PY

          if grep -Fq 'F26-Correct-Horse-Battery-Staple!' "$a_log" "$b_log"; then
            echo 'password leaked to server log'; exit 1
          fi
          if grep -Fq 'BEGIN PRIVATE KEY' "$a_log" "$b_log"; then
            echo 'private key material leaked to server log'; exit 1
          fi
          echo "ASTRAHOLD_F26_REVOCATION_ROLLOUT_OK required_ack_gate=true delayed_member_blocks_convergence=true timeout_incomplete=true resumable_wait=true rollback_fenced=true healthy_leaf_survives=true direct_client_unchanged=true protocol=9 tls=1.3"
