name: Production Trusted Proxy Edge Policy Reload E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  trusted-proxy-edge-policy-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build production server tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          go build -o "$GITHUB_WORKSPACE/.tools/worldd" ./cmd/worldd
          go build -o "$GITHUB_WORKSPACE/.tools/accountctl" ./cmd/accountctl

      - name: Run trusted proxy edge policy reload acceptance
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/s4f19-data"
          tls_dir="$data_root/tls"
          accounts_file="$data_root/accounts.json"
          recovery_file="$data_root/recovery-provider.json"
          edge_policy="$data_root/edge-policy.json"
          edge_ca_live="$tls_dir/edge-ca-live.crt"
          server_log="$RUNNER_TEMP/s4f19-worldd.log"
          proxy_a_log="$RUNNER_TEMP/s4f19-proxy-a.log"
          proxy_a2_log="$RUNNER_TEMP/s4f19-proxy-a2.log"
          proxy_c_log="$RUNNER_TEMP/s4f19-proxy-c.log"
          holder_log="$RUNNER_TEMP/s4f19-holder.log"
          proxy_script="$RUNNER_TEMP/s4f19-proxy.py"
          holder_script="$RUNNER_TEMP/s4f19-holder.py"
          holder_ready="$RUNNER_TEMP/s4f19-holder.ready"
          holder_continue="$RUNNER_TEMP/s4f19-holder.continue"
          wrong_password="F19-Wrong-Password-Should-Not-Log!"
          recovery_code="F19-High-Entropy-Recovery-Code-0123456789abcdef"
          ACCOUNTCTL="$GITHUB_WORKSPACE/.tools/accountctl"

          rm -rf "$data_root"
          rm -f "$holder_ready" "$holder_continue"
          mkdir -p "$data_root" "$tls_dir" "$data_root/character-state"

          "$ACCOUNTCTL" init -path "$accounts_file"
          printf '%s\n' 'F19-Correct-Horse-Battery-Staple!' | "$ACCOUNTCTL" create \
            -path "$accounts_file" \
            -login holder \
            -character f19-character \
            -password-stdin

          python3 - "$recovery_file" "$recovery_code" <<'PY'
          import hashlib, json, os, sys
          path, code = sys.argv[1:]
          with open(path, "x", encoding="utf-8") as f:
              json.dump({
                  "schema_version": 1,
                  "revision": "f19-ci-recovery-provider-001",
                  "subjects": [{
                      "login_id": "holder",
                      "recovery_code_sha256": hashlib.sha256(code.encode()).hexdigest(),
                  }],
              }, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          os.chmod(path, 0o600)
          PY

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-ca.key" -out "$tls_dir/server-ca.crt" -days 1 -sha256 \
            -subj "/CN=Astrahold S4-F.19 Server CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-a.key" -out "$tls_dir/server-a.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          cat >"$tls_dir/server.ext" <<'EOF_SERVER_EXT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          EOF_SERVER_EXT
          openssl x509 -req -in "$tls_dir/server-a.csr" \
            -CA "$tls_dir/server-ca.crt" -CAkey "$tls_dir/server-ca.key" -CAcreateserial \
            -out "$tls_dir/server-a.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1
          cp "$tls_dir/server-a.crt" "$tls_dir/server-live.crt"
          cp "$tls_dir/server-a.key" "$tls_dir/server-live.key"

          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-c.key" -out "$tls_dir/server-c.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          openssl x509 -req -in "$tls_dir/server-c.csr" \
            -CA "$tls_dir/server-ca.crt" -CAkey "$tls_dir/server-ca.key" -CAcreateserial \
            -out "$tls_dir/server-c.crt" -days 1 -sha256 -extfile "$tls_dir/server.ext" >/dev/null 2>&1

          make_edge_ca() {
            label="$1"
            openssl req -x509 -newkey rsa:2048 -nodes \
              -keyout "$tls_dir/edge-ca-$label.key" -out "$tls_dir/edge-ca-$label.crt" -days 1 -sha256 \
              -subj "/CN=Astrahold S4-F.19 Edge CA $label" \
              -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          }

          make_edge_cert() {
            label="$1"
            ca_label="$2"
            dns_name="$3"
            openssl req -newkey rsa:2048 -nodes \
              -keyout "$tls_dir/edge-$label.key" -out "$tls_dir/edge-$label.csr" \
              -subj "/CN=$dns_name" >/dev/null 2>&1
            cat >"$tls_dir/edge-$label.ext" <<EOF_EDGE_EXT
          subjectAltName=DNS:$dns_name
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          EOF_EDGE_EXT
            openssl x509 -req -in "$tls_dir/edge-$label.csr" \
              -CA "$tls_dir/edge-ca-$ca_label.crt" -CAkey "$tls_dir/edge-ca-$ca_label.key" -CAcreateserial \
              -out "$tls_dir/edge-$label.crt" -days 1 -sha256 -extfile "$tls_dir/edge-$label.ext" >/dev/null 2>&1
          }

          make_edge_ca a
          make_edge_ca b
          make_edge_cert a a edge-a.astrahold.test
          make_edge_cert b a edge-b.astrahold.test
          make_edge_cert a2 b edge-a-v2.astrahold.test
          make_edge_cert c b edge-c.astrahold.test
          cp "$tls_dir/edge-ca-a.crt" "$edge_ca_live"

          write_edge_policy() {
            generation="$1"
            python3 - "$edge_policy" "$generation" <<'PY'
          import json, os, sys
          path, generation = sys.argv[1:]
          if generation == "1":
              document = {
                  "schema_version": 1,
                  "revision": "edge-001",
                  "forwarded_header": "x-forwarded-for",
                  "client_ca_file": "tls/edge-ca-live.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a.astrahold.test"]},
                      {"prefixes": ["127.0.0.3/32"], "dns_names": ["edge-b.astrahold.test"]},
                      {"prefixes": ["10.0.0.0/8"], "dns_names": ["internal-a.astrahold.test"]},
                  ],
              }
          elif generation == "2":
              document = {
                  "schema_version": 1,
                  "revision": "edge-002",
                  "forwarded_header": "forwarded",
                  "client_ca_file": "tls/edge-ca-live.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["edge-a-v2.astrahold.test"]},
                      {"prefixes": ["127.0.0.4/32"], "dns_names": ["edge-c.astrahold.test"]},
                      {"prefixes": ["172.16.0.0/12"], "dns_names": ["internal-b.astrahold.test"]},
                  ],
              }
          else:
              document = {
                  "schema_version": 1,
                  "revision": "edge-invalid",
                  "forwarded_header": "forwarded",
                  "client_ca_file": "tls/edge-ca-live.crt",
                  "bindings": [
                      {"prefixes": ["127.0.0.0/8"], "dns_names": ["bad-a.astrahold.test"]},
                      {"prefixes": ["127.0.0.2/32"], "dns_names": ["bad-b.astrahold.test"]},
                  ],
              }
          temp = path + ".tmp"
          with open(temp, "w", encoding="utf-8") as f:
              json.dump(document, f, indent=2)
              f.write("\n")
              f.flush()
              os.fsync(f.fileno())
          os.replace(temp, path)
          os.chmod(path, 0o600)
          PY
          }
          write_edge_policy 1
          chmod 600 "$accounts_file" "$recovery_file" "$edge_policy" "$tls_dir"/*.key

          cat >"$proxy_script" <<'PY'
          import http.client
          import http.server
          import ssl
          import sys

          listen_port, source_ip, server_ca, public_cert, public_key, client_cert, client_key = sys.argv[1:]
          upstream_context = ssl.create_default_context(cafile=server_ca)
          upstream_context.minimum_version = ssl.TLSVersion.TLSv1_3
          upstream_context.load_cert_chain(certfile=client_cert, keyfile=client_key)

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def log_message(self, *_):
                  pass
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  headers = {"Content-Type": self.headers.get("Content-Type", "application/json")}
                  for name in ("X-Forwarded-For", "Forwarded"):
                      if name in self.headers:
                          headers[name] = self.headers[name]
                  try:
                      connection = http.client.HTTPSConnection(
                          "127.0.0.1", 39444,
                          context=upstream_context,
                          source_address=(source_ip, 0), timeout=5,
                      )
                      connection.request("POST", self.path, body=body, headers=headers)
                      response = connection.getresponse()
                      response_body = response.read()
                      self.send_response(response.status)
                      for name in ("Content-Type", "Cache-Control", "Pragma", "Retry-After"):
                          value = response.getheader(name)
                          if value is not None:
                              self.send_header(name, value)
                      self.send_header("Content-Length", str(len(response_body)))
                      self.end_headers()
                      self.wfile.write(response_body)
                      connection.close()
                  except Exception as exc:
                      data = b"upstream unavailable\n"
                      self.send_response(502)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
                      print("upstream failure", type(exc).__name__, flush=True)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", int(listen_port)), Handler)
          downstream = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          downstream.minimum_version = ssl.TLSVersion.TLSv1_3
          downstream.load_cert_chain(certfile=public_cert, keyfile=public_key)
          server.socket = downstream.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY

          cat >"$holder_script" <<'PY'
          import http.client
          import os
          import ssl
          import sys
          import time

          server_ca, client_cert, client_key, ready, go = sys.argv[1:]
          context = ssl.create_default_context(cafile=server_ca)
          context.minimum_version = ssl.TLSVersion.TLSv1_3
          context.load_cert_chain(certfile=client_cert, keyfile=client_key)
          connection = http.client.HTTPSConnection(
              "127.0.0.1", 39444, context=context,
              source_address=("127.0.0.2", 0), timeout=5,
          )

          def login(source):
              body = b'{"login_id":"holder","login_secret":"F19-holder-wrong"}'
              connection.request("POST", "/v1/session/login", body=body, headers={
                  "Content-Type": "application/json",
                  "X-Forwarded-For": source,
              })
              response = connection.getresponse()
              response.read()
              return response.status

          assert login("198.51.100.70") == 401
          with open(ready, "w", encoding="utf-8") as f:
              f.write("ready\n")
          for _ in range(300):
              if os.path.exists(go):
                  break
              time.sleep(0.1)
          else:
              raise RuntimeError("timed out waiting for edge policy rotation")
          assert login("198.51.100.71") == 401
          connection.close()
          print("ASTRAHOLD_F19_OLD_EDGE_CONNECTION_OK", flush=True)
          PY

          cleanup() {
            set +e
            for pid in "${holder_pid:-}" "${proxy_a_pid:-}" "${proxy_a2_pid:-}" "${proxy_c_pid:-}" "${server_pid:-}"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          wait_for_marker() {
            file="$1"
            marker="$2"
            pid="$3"
            attempts="${4:-300}"
            i=0
            while [ "$i" -lt "$attempts" ]; do
              if grep -Fq "$marker" "$file" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process exited before marker: $marker"
                cat "$file" || true
                cat "$server_log" || true
                return 1
              fi
              sleep 0.1
              i=$((i + 1))
            done
            echo "timed out waiting for marker: $marker"
            cat "$file" || true
            cat "$server_log" || true
            return 1
          }

          wait_for_file() {
            path="$1"
            pid="$2"
            for _ in $(seq 1 300); do
              if [ -f "$path" ]; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "$holder_log" || true; return 1; fi
              sleep 0.1
            done
            echo "timed out waiting for $path"
            cat "$holder_log" || true
            return 1
          }

          "$GITHUB_WORKSPACE/.tools/worldd" \
            -tcp 127.0.0.1:39777 \
            -udp 127.0.0.1:39778 \
            -session-login-account-file "$accounts_file" \
            -session-login-tls-listen 127.0.0.1:39444 \
            -session-login-tls-cert "$tls_dir/server-live.crt" \
            -session-login-tls-key "$tls_dir/server-live.key" \
            -session-login-trusted-proxy-edge-policy-file "$edge_policy" \
            -session-login-ip-max-attempts 1 \
            -session-login-ip-attempt-window 1m \
            -session-recovery-provider-file "$recovery_file" \
            -session-recovery-challenge-ttl 10m \
            -session-recovery-challenge-max-attempts 5 \
            -session-recovery-ip-max-attempts 1 \
            -session-recovery-ip-attempt-window 1m \
            -character-state-dir "$data_root/character-state" \
            -character-state-save-journal "$data_root/character-state-saves.journal" \
            -character-state-save-checkpoint "$data_root/character-state-saves.checkpoint.json" \
            -death-outcome-journal "$data_root/death-outcomes.journal" \
            -death-outcome-checkpoint "$data_root/death-outcomes.checkpoint.json" \
            -siege-ownership-dir "$data_root/siege-ownership" >"$server_log" 2>&1 &
          server_pid=$!

          wait_for_marker "$server_log" "Astrahold worldd ready: protocol=9" "$server_pid"
          wait_for_marker "$server_log" "source_attribution=edge-policy/x-forwarded-for trusted_proxy_prefixes=3 forwarded_max_hops=16 proxy_auth=edge-policy-mtls-v1 proxy_trust_generation=1 proxy_trust_revision=edge-001 proxy_identity_count=3 edge_policy_generation=1 edge_policy_revision=edge-001 edge_policy_bindings=3" "$server_pid"

          login_body="$(printf '{"login_id":"holder","login_secret":"%s"}' "$wrong_password")"

          direct_status="$(printf '%s' "$login_body" | curl --silent --show-error \
            --cacert "$tls_dir/server-ca.crt" --output /tmp/f19-direct --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: forged-direct-value' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$direct_status" = "401"

          if printf '%s' "$login_body" | curl --silent --show-error --fail-with-body \
            --interface 127.0.0.2 --cacert "$tls_dir/server-ca.crt" \
            --cert "$tls_dir/edge-b.crt" --key "$tls_dir/edge-b.key" \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.2' \
            --data-binary @- https://localhost:39444/v1/session/login >/tmp/f19-cross-binding 2>&1; then
            echo "cross-binding certificate unexpectedly completed trusted edge TLS"
            exit 1
          fi

          python3 "$proxy_script" 39555 127.0.0.2 "$tls_dir/server-ca.crt" "$tls_dir/server-a.crt" "$tls_dir/server-a.key" \
            "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" >"$proxy_a_log" 2>&1 &
          proxy_a_pid=$!
          for _ in $(seq 1 100); do
            status="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
              --output /tmp/f19-proxy-a --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.10' \
              --data-binary @- https://localhost:39555/v1/session/login 2>/dev/null || true)"
            if [ "$status" = "401" ]; then break; fi
            if ! kill -0 "$proxy_a_pid" 2>/dev/null; then cat "$proxy_a_log"; exit 1; fi
            sleep 0.1
          done
          test "${status:-}" = "401"
          status_repeat="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-proxy-a-repeat --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.10' \
            --data-binary @- https://localhost:39555/v1/session/login)"
          test "$status_repeat" = "429"

          python3 "$holder_script" "$tls_dir/server-ca.crt" "$tls_dir/edge-a.crt" "$tls_dir/edge-a.key" \
            "$holder_ready" "$holder_continue" >"$holder_log" 2>&1 &
          holder_pid=$!
          wait_for_file "$holder_ready" "$holder_pid"

          cp "$tls_dir/edge-ca-b.crt" "$edge_ca_live"
          write_edge_policy 2
          cp "$tls_dir/server-c.crt" "$tls_dir/server-live.crt"
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session login TLS certificate reload rejected; last-known-good retained: generation=1" "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload applied: previous_generation=1 generation=2 previous_revision=edge-001 revision=edge-002 previous_header=x-forwarded-for header=forwarded roots=1 bindings=3 prefixes=3 identities=3" "$server_pid"

          touch "$holder_continue"
          wait "$holder_pid"
          holder_pid=""
          grep -F "ASTRAHOLD_F19_OLD_EDGE_CONNECTION_OK" "$holder_log"

          post_rotation_a="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-proxy-a-after --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.11' \
            --data-binary @- https://localhost:39555/v1/session/login)"
          test "$post_rotation_a" = "502"

          python3 "$proxy_script" 39556 127.0.0.2 "$tls_dir/server-ca.crt" "$tls_dir/server-a.crt" "$tls_dir/server-a.key" \
            "$tls_dir/edge-a2.crt" "$tls_dir/edge-a2.key" >"$proxy_a2_log" 2>&1 &
          proxy_a2_pid=$!
          for _ in $(seq 1 100); do
            status_a2="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
              --output /tmp/f19-proxy-a2 --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.20' \
              --data-binary @- https://localhost:39556/v1/session/login 2>/dev/null || true)"
            if [ "$status_a2" = "401" ]; then break; fi
            if ! kill -0 "$proxy_a2_pid" 2>/dev/null; then cat "$proxy_a2_log"; exit 1; fi
            sleep 0.1
          done
          test "${status_a2:-}" = "401"

          wrong_header="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-wrong-header --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 198.51.100.21' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$wrong_header" = "400"

          python3 "$proxy_script" 39557 127.0.0.4 "$tls_dir/server-ca.crt" "$tls_dir/server-a.crt" "$tls_dir/server-a.key" \
            "$tls_dir/edge-c.crt" "$tls_dir/edge-c.key" >"$proxy_c_log" 2>&1 &
          proxy_c_pid=$!
          for _ in $(seq 1 100); do
            status_c="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
              --output /tmp/f19-proxy-c --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.30' \
              --data-binary @- https://localhost:39557/v1/session/login 2>/dev/null || true)"
            if [ "$status_c" = "401" ]; then break; fi
            if ! kill -0 "$proxy_c_pid" 2>/dev/null; then cat "$proxy_c_log"; exit 1; fi
            sleep 0.1
          done
          test "${status_c:-}" = "401"

          removed_1="$(printf '%s' "$login_body" | curl --silent --show-error --interface 127.0.0.3 \
            --cacert "$tls_dir/server-ca.crt" --output /tmp/f19-removed-1 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.40' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$removed_1" = "401"
          removed_2="$(printf '%s' "$login_body" | curl --silent --show-error --interface 127.0.0.3 \
            --cacert "$tls_dir/server-ca.crt" --output /tmp/f19-removed-2 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.41' \
            --data-binary @- https://localhost:39444/v1/session/login)"
          test "$removed_2" = "429"

          chain_1="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-chain-1 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.55, for=172.16.0.9' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$chain_1" = "401"
          chain_2="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-chain-2 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.55, for=172.16.0.10' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$chain_2" = "429"

          old_hop_1="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-old-hop-1 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.56, for=10.0.0.9' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$old_hop_1" = "401"
          old_hop_2="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-old-hop-2 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.57, for=10.0.0.9' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$old_hop_2" = "429"

          recovery_1="$(printf '{"login_id":"holder"}' | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-recovery-1 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=203.0.113.10' \
            --data-binary @- https://localhost:39557/v1/account/recovery/request)"
          test "$recovery_1" = "202"
          recovery_2="$(printf '{"login_id":"holder"}' | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-recovery-2 --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=203.0.113.10' \
            --data-binary @- https://localhost:39557/v1/account/recovery/request)"
          test "$recovery_2" = "429"

          write_edge_policy invalid
          kill -HUP "$server_pid"
          wait_for_marker "$server_log" "session trusted proxy edge policy reload rejected; last-known-good retained: generation=2 revision=edge-002 header=forwarded bindings=3" "$server_pid"

          lkg_status="$(printf '%s' "$login_body" | curl --silent --show-error --cacert "$tls_dir/server-ca.crt" \
            --output /tmp/f19-lkg --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Forwarded: for=198.51.100.80' \
            --data-binary @- https://localhost:39556/v1/session/login)"
          test "$lkg_status" = "401"

          for forbidden in "$wrong_password" "$recovery_code" edge-a.astrahold.test edge-a-v2.astrahold.test edge-c.astrahold.test forged-direct-value 198.51.100.55; do
            if grep -Fq "$forbidden" "$server_log"; then
              echo "worldd log leaked F.19 secret, identity, or forwarding metadata: $forbidden"
              cat "$server_log"
              exit 1
            fi
          done

          echo "ASTRAHOLD_F19_E2E_OK atomic_edge_generation=true network_identity_binding=true header_rotation=true prefix_rotation=true old_connection_pinned=true new_handshake_cutover=true invalid_lkg=true tls_reload_independent=true direct_client_unchanged=true recovery_unchanged=true protocol=9 tls=1.3"

      - name: Upload F.19 edge policy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4f19-trusted-proxy-edge-policy-logs
          path: |
            ${{ runner.temp }}/s4f19-worldd.log
            ${{ runner.temp }}/s4f19-proxy-a.log
            ${{ runner.temp }}/s4f19-proxy-a2.log
            ${{ runner.temp }}/s4f19-proxy-c.log
            ${{ runner.temp }}/s4f19-holder.log
          if-no-files-found: ignore
