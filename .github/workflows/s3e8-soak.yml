name: S3-E.8 Repeated Churn Soak

on:
  pull_request:
    paths:
      - 'cmd/loadbot/**'
      - 'cmd/loadserver/**'
      - 'internal/codec/**'
      - 'internal/protocol/**'
      - 'internal/replication/**'
      - 'internal/loadlab/**'
      - 'internal/spatial/**'
      - 'internal/simulation/**'
      - 'internal/worldruntime/**'
      - 'internal/netadapter/tcpudp/**'
      - '.github/workflows/s3e8-soak.yml'

jobs:
  repeated-churn-500:
    if: startsWith(github.head_ref, 'agent/s3e8')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build load tools
        run: |
          go build -o /tmp/astrahold-loadserver ./cmd/loadserver
          go build -o /tmp/astrahold-loadbot ./cmd/loadbot
      - name: Run 500-client 8-round repeated churn soak
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          /tmp/astrahold-loadserver \
            -tcp 127.0.0.1:20777 \
            -udp 127.0.0.1:20778 \
            -clients 500 \
            -scenario teleport-churn \
            -churn-rounds 8 \
            -duration 5s \
            -shutdown-grace 2s \
            -ready-timeout 60s \
            -convergence-timeout 30s \
            -convergence-stable 250ms \
            -churn-timeout 15s \
            -churn-stable 250ms \
            -report artifacts/soak-server.json \
            > artifacts/soak-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1

          set +e
          /tmp/astrahold-loadbot \
            -tcp 127.0.0.1:20777 \
            -clients 500 \
            -scenario teleport-churn \
            -input-rate 20 \
            -ramp-up 5s \
            -duration 75s \
            -report artifacts/soak-bots.json \
            > artifacts/soak-bots.log 2>&1
          BOT_STATUS=$?
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e

          cat artifacts/soak-server-convergence.json || true
          cat artifacts/soak-server-churn-soak.json || true
          cat artifacts/soak-server.json || true
          cat artifacts/soak-bots.json || true
          test "$BOT_STATUS" -eq 0
          test "$SERVER_STATUS" -eq 0

          jq -e '.ready_clients == 500 and .failed_connections == 0 and .decode_errors == 0 and .network_errors == 0 and .incomplete_snapshot_resets == 0 and .completed_snapshots > 0' artifacts/soak-bots.json >/dev/null
          # Initial 125k Spawn；8 輪每輪再產生 62.5k Spawn + 62.5k Despawn。
          jq -e '.spawns == 625000 and .despawns == 500000' artifacts/soak-bots.json >/dev/null
          # Spawn + Vitals + Despawn + 500 Dynamic 的 Reliable minimum。
          jq -e '.reliable_messages >= 1750500' artifacts/soak-bots.json >/dev/null

          jq -e '.phase == "convergence" and .convergence.observation.world.replication_views == 500 and .convergence.observation.world.built_views == 500 and .convergence.observation.world.desired_relationships == 125000 and .convergence.observation.world.known_desired == 125000 and .convergence.observation.world.pending_spawns == 0 and .convergence.observation.world.pending_despawns == 0 and .convergence.observation.world.pending_vitals_entities == 0 and .convergence.observation.world.pending_dynamic_sessions == 0 and .convergence.reliable.queued == 0 and .convergence.reliable.in_flight == 0' artifacts/soak-server-convergence.json >/dev/null

          # S3-E.8 第一個 hard requirement：既有 S3-E.7 單輪 gate 必須對每一輪都成立。
          jq -e '.rounds == 8 and (.round | length) == 8 and .max_tick_p99_ms < 50 and .max_trigger_to_converged_seconds < 2.75' artifacts/soak-server-churn-soak.json >/dev/null
          jq -e 'all(.round[]; .observed_non_converged == true and .desired_relationships == 125000 and .known_desired == 125000 and .pending_spawns == 0 and .pending_despawns == 0 and .pending_vitals_entities == 0 and .pending_dynamic_sessions == 0 and .reliable_queued == 0 and .reliable_in_flight == 0)' artifacts/soak-server-churn-soak.json >/dev/null
          jq -e 'all(.round[]; .tick_p99_ms < 50 and .trigger_to_converged_seconds < 2.75 and .spawn_selected >= 62500 and .despawn_selected >= 62500)' artifacts/soak-server-churn-soak.json >/dev/null
          jq -e 'all(.round[]; .max_lifecycle_selected_per_tick <= 6000 and .max_initial_vitals_selected_per_tick <= 2500)' artifacts/soak-server-churn-soak.json >/dev/null
          jq -e 'all(.round[]; .command_errors == 0 and .unexpected_tick_errors == 0 and .delivery_errors == 0 and .network_errors == 0 and .datagram_too_large == 0)' artifacts/soak-server-churn-soak.json >/dev/null
          jq -e '.total_spawn_selected >= 500000 and .total_despawn_selected >= 500000 and .total_initial_vitals_selected >= 500000' artifacts/soak-server-churn-soak.json >/dev/null

          # Memory/GC high-water 先收 baseline，不先用未量測過的 growth threshold 自我驗證。
          jq -e '.max_heap_alloc_bytes > 0 and .max_heap_sys_bytes > 0 and .total_alloc_bytes > 0' artifacts/soak-server-churn-soak.json >/dev/null

          jq -e '.phase == "steady-state" and .ticks > 0 and .errors.datagram_too_large == 0 and .errors.unexpected_tick_errors == 0 and .errors.delivery_errors == 0 and .errors.network_errors == 0 and .errors.command_errors == 0 and .tick_duration.p99_ms < 50' artifacts/soak-server.json >/dev/null
      - name: Upload S3-E.8 soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3e8-repeated-churn-500
          path: artifacts/
